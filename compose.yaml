services:
  workbench:
    build:
      context: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      AGENTICRAG_STORE: sqlite
      AGENTICRAG_LOCAL_RUNTIME_HOSTS: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agenticrag-data:/app/.data
    restart: unless-stopped

volumes:
  agenticrag-data:
