<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone offline</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,400..600&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
.t{font-family:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.theme-dark{--bg:#0C0C0D;--side:#111113;--surf:#161618;--raised:#1C1C1F;--hover:#222226;--line:#232327;--line2:#33333A;--ink:#EDEDEF;--ink2:#A8A8B0;--ink3:#85858D;--acc:#6E95FF;--acc-ink:#07102A;--acc-text:#9DB7FF;--acc-soft:rgba(110,149,255,.13);--acc-line:rgba(110,149,255,.45);--hl:rgba(110,149,255,.22);--ev:#7CCFE0;--ev-soft:rgba(124,207,224,.10);--ev-line:rgba(124,207,224,.34);--ok:#62CF8F;--ok-soft:rgba(98,207,143,.11);--warn:#E9B949;--warn-soft:rgba(233,185,73,.12);--err:#F2786D;--err-soft:rgba(242,120,109,.12);--err-line:rgba(242,120,109,.40);--scrim:rgba(5,5,6,.62);--shadow:0 18px 50px rgba(0,0,0,.45);--pop-shadow:0 24px 64px rgba(0,0,0,.55);color-scheme:dark}
.theme-midnight{--bg:#000000;--side:#070708;--surf:#0E0E10;--raised:#141417;--hover:#1B1B1F;--line:#1C1C20;--line2:#2A2A30;--ink:#ECECEF;--ink2:#A3A3AB;--ink3:#82828A;--acc:#6E95FF;--acc-ink:#07102A;--acc-text:#9DB7FF;--acc-soft:rgba(110,149,255,.14);--acc-line:rgba(110,149,255,.48);--hl:rgba(110,149,255,.24);--ev:#7CCFE0;--ev-soft:rgba(124,207,224,.10);--ev-line:rgba(124,207,224,.34);--ok:#62CF8F;--ok-soft:rgba(98,207,143,.11);--warn:#E9B949;--warn-soft:rgba(233,185,73,.12);--err:#F2786D;--err-soft:rgba(242,120,109,.12);--err-line:rgba(242,120,109,.40);--scrim:rgba(0,0,0,.72);--shadow:0 18px 50px rgba(0,0,0,.8);--pop-shadow:0 24px 64px rgba(0,0,0,.85);color-scheme:dark}
.theme-light{--bg:#FAFAF8;--side:#F3F3F0;--surf:#FFFFFF;--raised:#FFFFFF;--hover:#ECECE8;--line:#E5E5E0;--line2:#D2D2CC;--ink:#17171A;--ink2:#52525A;--ink3:#6A6A72;--acc:#2F5BEA;--acc-ink:#FFFFFF;--acc-text:#2448C4;--acc-soft:rgba(47,91,234,.09);--acc-line:rgba(47,91,234,.40);--hl:rgba(47,91,234,.14);--ev:#0B7285;--ev-soft:rgba(11,114,133,.07);--ev-line:rgba(11,114,133,.30);--ok:#1E7F46;--ok-soft:rgba(30,127,70,.08);--warn:#8A5F00;--warn-soft:rgba(138,95,0,.08);--err:#B83227;--err-soft:rgba(184,50,39,.07);--err-line:rgba(184,50,39,.35);--scrim:rgba(23,23,26,.32);--shadow:0 16px 40px rgba(24,24,28,.09);--pop-shadow:0 24px 60px rgba(24,24,28,.16);color-scheme:light}
.theme-paper{--bg:#F5F0E6;--side:#EDE6D8;--surf:#FBF8F2;--raised:#FFFDF9;--hover:#E8E0CF;--line:#E2D8C6;--line2:#D0C3AC;--ink:#221E18;--ink2:#574F43;--ink3:#6B6253;--acc:#2F5BEA;--acc-ink:#FFFFFF;--acc-text:#2448C4;--acc-soft:rgba(47,91,234,.09);--acc-line:rgba(47,91,234,.40);--hl:rgba(47,91,234,.13);--ev:#0A6878;--ev-soft:rgba(10,104,120,.08);--ev-line:rgba(10,104,120,.30);--ok:#1E7443;--ok-soft:rgba(30,116,67,.08);--warn:#7F5700;--warn-soft:rgba(127,87,0,.08);--err:#A92E24;--err-soft:rgba(169,46,36,.07);--err-line:rgba(169,46,36,.35);--scrim:rgba(34,30,24,.30);--shadow:0 16px 40px rgba(60,45,20,.10);--pop-shadow:0 24px 60px rgba(60,45,20,.18);color-scheme:light}
.fam-dark.acc-amber{--acc:#F0A43A;--acc-ink:#1B1204;--acc-text:#F5B962;--acc-soft:rgba(240,164,58,.12);--acc-line:rgba(240,164,58,.42);--hl:rgba(240,164,58,.22)}
.fam-light.acc-amber{--acc:#BB6E0A;--acc-ink:#1B1204;--acc-text:#8A4E00;--acc-soft:rgba(232,150,42,.13);--acc-line:rgba(200,120,20,.45);--hl:rgba(232,150,42,.24)}
.fam-dark.acc-mono{--acc:#EDEDEF;--acc-ink:#0C0C0D;--acc-text:#FFFFFF;--acc-soft:rgba(237,237,239,.08);--acc-line:rgba(237,237,239,.38);--hl:rgba(237,237,239,.14)}
.fam-light.acc-mono{--acc:#17171A;--acc-ink:#FFFFFF;--acc-text:#17171A;--acc-soft:rgba(23,23,26,.06);--acc-line:rgba(23,23,26,.35);--hl:rgba(23,23,26,.10)}
.fam-dark.hc{--ink2:#D4D4D9;--ink3:#B4B4BC;--line:#3A3A42;--line2:#55555E}
.fam-light.hc{--ink2:#2E2E34;--ink3:#45454C;--line:#C9C9C2;--line2:#9E9E96}
.read-serif{--read:'Newsreader',Georgia,serif;--read-size:17px;--read-lh:1.6}
.read-sans{--read:'Geist',ui-sans-serif,system-ui,sans-serif;--read-size:15px;--read-lh:1.68}
.read-literata{--read:'Literata',Georgia,serif;--read-size:16.5px;--read-lh:1.62}
.read-atkinson{--read:'Atkinson Hyperlegible Next',ui-sans-serif,system-ui,sans-serif;--read-size:16px;--read-lh:1.62}
.t.ui-atkinson{font-family:'Atkinson Hyperlegible Next',ui-sans-serif,system-ui,sans-serif}
.t.ui-system{font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif}
.t.size-s{--read-size:15px}
.t.size-l{--read-size:19.5px}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.t button{font-family:inherit;cursor:pointer}
.t textarea,.t input{font-family:inherit}
.t textarea::placeholder,.t input::placeholder{color:var(--ink3)}
.t a{color:var(--acc-text)}
.i{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.hov{transition:background .14s,color .14s,border-color .14s}
.hov:hover{background:var(--hover) !important;color:var(--ink) !important}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:18px;padding:0 5px;margin:0 1px 0 3px;border-radius:5px;border:1px solid var(--ev-line);background:var(--ev-soft);color:var(--ev);font:500 11px/1 'Geist Mono',ui-monospace,monospace;vertical-align:2px}
.t mark{background:var(--hl);color:var(--ink);border-radius:3px;padding:0 1px}
.t :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{height:36px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;white-space:nowrap;text-decoration:none;transition:background .14s,color .14s,border-color .14s,filter .14s}
.btn-pri{background:var(--acc);color:var(--acc-ink) !important}
.btn-pri:hover{filter:brightness(1.07)}
.btn-sec{background:transparent;border-color:var(--line2);color:var(--ink) !important}
.btn-ghost{background:transparent;color:var(--ink2) !important}
.btn-sec:hover,.btn-ghost:hover{background:var(--hover);color:var(--ink) !important}
.btn-danger{background:#C93A31;color:#FFFFFF !important}
.btn-danger:hover{filter:brightness(1.08)}
.btn-lg{height:48px;border-radius:12px;font-size:15px}
.pop{background:var(--raised);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--pop-shadow)}
.lbl{font-size:12px;font-weight:500;color:var(--ink3)}
.kbd{font:500 11px/1 'Geist Mono',ui-monospace,monospace;color:var(--ink3)}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-size:13.5px;text-align:left;transition:background .12s}
.mi:hover{background:var(--hover)}
.toast{display:flex;align-items:center;gap:11px;min-height:50px;padding:7px 7px 7px 14px;border-radius:12px;background:var(--raised);border:1px solid var(--line2);box-shadow:var(--pop-shadow);font-size:13.5px}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.seg-o{height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--ink2);font-size:13px;font-weight:500;transition:background .12s,color .12s}
.seg-o:hover{color:var(--ink)}
.sw{position:relative;width:36px;height:22px;border-radius:999px;border:0;padding:0;flex-shrink:0;transition:background .16s}
.sw-k{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .16s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}65%{transform:scale(1.22);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes leave{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.03)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.a-spin{animation:spin .8s linear infinite;transform-origin:50% 50%}
.a-draw{stroke-dasharray:60;animation:draw .7s cubic-bezier(.3,.7,.2,1) both}
.a-pop{animation:pop .42s cubic-bezier(.3,.7,.2,1) both}
.a-fadeup{animation:fadeUp .36s ease-out both}
.a-fadein{animation:fadeIn .4s ease-out both}
.a-rise{animation:rise .5s cubic-bezier(.3,.7,.2,1) both}
.a-leave{animation:leave .32s ease-in both}
.a-pulse{animation:pulse 1.6s ease-in-out infinite}
.d1{animation-delay:.12s}
.d2{animation-delay:.25s}
.d3{animation-delay:.4s}
.d4{animation-delay:.55s}
.rm *{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition:none !important}
@media (prefers-reduced-motion: reduce){.t *{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition:none !important}}
</style>
</helmet>
<div class="{{rootCls}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); overflow: hidden; font-size: 14px; line-height: 1.5">

<header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 60px; padding: 8px 8px 0; border-bottom: 1px solid var(--line)">
<button aria-label="Open menu" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--ink2); display: grid; place-items: center"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
<div style="flex-grow: 1; min-width: 0; font-size: 15px; font-weight: 600; padding-left: 2px">AgenticRAG</div>
<span role="status" style="height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 12px; margin-right: 6px; border: 1px solid var(--err-line); border-radius: 999px; background: var(--err-soft); color: var(--err); font-size: 12.5px; font-weight: 500"><span style="width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--err)"></span>{{pill}}</span>
</header>

<div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 18px">
<sc-if value="{{isMac}}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 240 64" aria-hidden="true" style="width: 200px; height: 54px; color: var(--ink3); flex-shrink: 0"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="26" width="76" height="24" rx="7"></rect><path d="M22 50v3M70 50v3"></path><path d="M92 38h30" stroke-dasharray="3 4"></path><path d="M142 38h44" stroke-dasharray="3 4"></path><rect x="196" y="12" width="26" height="44" rx="6"></rect><path d="M205 50h8"></path></g><circle cx="74" cy="38" r="2" fill="currentColor"></circle><g stroke-width="2" stroke-linecap="round" style="stroke: var(--err)"><path d="M127 33l10 10M137 33l-10 10"></path></g></svg>
</sc-if>
<sc-if value="{{isDevice}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 240 64" aria-hidden="true" style="width: 200px; height: 54px; color: var(--ink3); flex-shrink: 0"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="26" width="76" height="24" rx="7"></rect><path d="M22 50v3M70 50v3"></path><path d="M92 38h66" stroke-dasharray="3 4"></path><path d="M180 38h8" stroke-dasharray="3 4"></path><rect x="196" y="12" width="26" height="44" rx="6"></rect><path d="M205 50h8"></path></g><circle cx="74" cy="38" r="2" style="fill: var(--ok)"></circle><g stroke-width="2" stroke-linecap="round" style="stroke: var(--err)"><path d="M164 33l10 10M174 33l-10 10"></path></g></svg>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.22">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink2)">{{body}}</p>
</div>

<div role="status" style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink2)">
<sc-if value="{{trying}}" hint-placeholder-val="{{ false }}"><svg class="i a-spin" viewBox="0 0 24 24" style="width: 15px; height: 15px; color: var(--acc-text); stroke-width: 2"><path d="M12 3a9 9 0 019 9"></path></svg></sc-if>
<sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}"><span class="a-pulse" style="width: 8px; height: 8px; border-radius: 50%; background: var(--warn)"></span></sc-if>
<span>{{statusText}}</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button class="btn btn-pri btn-lg" onClick="{{tryNow}}">Try now</button>
<button class="btn btn-sec btn-lg" onClick="{{toggleChecks}}" aria-expanded="{{checksStr}}">{{checksLabel}}</button>
</div>

<sc-if value="{{showChecks}}" hint-placeholder-val="{{ false }}">
<div class="a-fadeup" style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--surf)">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line)">
<span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 7px; background: var(--hover); color: var(--ink2); display: grid; place-items: center; font-size: 12px; font-weight: 600">{{c.n}}</span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 550">{{c.title}}</span><span style="font-size: 13px; color: var(--ink2); line-height: 1.5">{{c.body}}</span></div>
</div>
</sc-for>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 6px; padding: 4px 2px 6px; font-size: 12.5px; font-weight: 500; color: var(--ink3)"><svg class="i" viewBox="0 0 24 24" style="width: 13px; height: 13px"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"></path></svg>Readable offline</div>
<button class="hov" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surf); color: var(--ink); font-size: 14px; text-align: left">Least-cleanup recipe<span style="flex-grow: 1"></span><span style="font-size: 12px; color: var(--ink3)">Today</span></button>
<button class="hov" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; margin-top: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surf); color: var(--ink); font-size: 14px; text-align: left">Why wet toppings go on last<span style="flex-grow: 1"></span><span style="font-size: 12px; color: var(--ink3)">Today</span></button>
<button class="hov" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; margin-top: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surf); color: var(--ink); font-size: 14px; text-align: left">Compare the four modes<span style="flex-grow: 1"></span><span style="font-size: 12px; color: var(--ink3)">Yesterday</span></button>
</div>
</div>

<div style="flex-shrink: 0; padding: 8px 12px 26px">
<div style="display: flex; align-items: center; gap: 6px; border: 1px dashed var(--line2); border-radius: 20px; background: var(--surf); padding: 4px 4px 4px 0">
<textarea aria-label="Write a draft question" placeholder="Write a draft for later…" rows="1" style="flex-grow: 1; height: 44px; padding: 12px 16px 0; border: 0; background: transparent; color: var(--ink); font-size: 16px; resize: none; outline: none"></textarea>
<button class="btn btn-sec" style="height: 44px; border-radius: 16px">Save</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cause":{"editor":"enum","options":["mac mini unreachable","this device offline"],"default":"mac mini unreachable"},"theme":{"editor":"enum","options":["dark","midnight","light","paper"],"default":"midnight"},"accent":{"editor":"enum","options":["cobalt","amber","mono"],"default":"cobalt"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.setState({ cd: 8, next: 8, trying: false, checks: false });
    this.iv = setInterval(function () {
      var s = self.state || {};
      if (s.trying) return;
      if ((s.cd || 0) <= 1) { self.attempt(); } else { self.setState({ cd: s.cd - 1 }); }
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tm); }
  attempt(reset) {
    var self = this;
    clearTimeout(this.tm);
    this.setState({ trying: true });
    this.tm = setTimeout(function () {
      var n = reset ? 8 : Math.min(((self.state && self.state.next) || 8) * 2, 30);
      self.setState({ trying: false, cd: n, next: n });
    }, 1400);
  }
  renderVals() {
    var s = this.state || {};
    var theme = this.props.theme || 'midnight';
    var accent = this.props.accent || 'cobalt';
    var fam = (theme === 'light' || theme === 'paper') ? 'fam-light' : 'fam-dark';
    var device = (this.props.cause || '') === 'this device offline';
    var self = this;
    var checks = device ? [
      { n: '1', title: 'Wi-Fi or cellular', body: 'This phone has no connection right now. The Mac mini may be fine.' },
      { n: '2', title: 'Tailscale', body: 'After a network change it can take a moment to reconnect. Check that Tailscale says Connected.' }
    ] : [
      { n: '1', title: 'Mac mini awake and powered?', body: 'Sleep or a power cut stops it.' },
      { n: '2', title: 'Tailscale connected?', body: 'Check both this phone and the Mac mini.' },
      { n: '3', title: 'AgenticRAG running?', body: 'After a restart it has to be started again.' }
    ];
    return {
      rootCls: 't theme-' + theme + ' ' + fam + ' acc-' + accent + ' read-serif',
      isMac: !device, isDevice: device,
      title: device ? 'This phone is offline' : 'Your Mac mini isn’t answering',
      body: device
        ? 'Nothing can reach your Mac mini until this phone is back online. Chats you’ve opened here are still readable.'
        : 'Answers are paused until it’s back. Chats you’ve opened on this phone are still readable.',
      pill: device ? 'No connection' : 'Offline',
      trying: !!s.trying, waiting: !s.trying,
      statusText: s.trying ? (device ? 'Checking for a connection…' : 'Trying to reach your Mac mini…') : (device ? 'Checking again in ' : 'Trying again in ') + (s.cd || 8) + ' s · last connected 21:02',
      showChecks: !!s.checks, checksStr: s.checks ? 'true' : 'false',
      checksLabel: s.checks ? 'Hide checks' : 'What to check',
      checks: checks,
      tryNow: function () { self.attempt(true); },
      toggleChecks: function () { self.setState({ checks: !(self.state && self.state.checks) }); }
    };
  }
}
</script>
</body>
</html>
