.t textarea::placeholder,.t input::placeholder{color:var(--ink3)}
.t a{color:var(--acc-text)}
.i{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.hov{transition:background .14s,color .14s,border-color .14s}

@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}65%{transform:scale(1.22);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes leave{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.03)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.a-spin{animation:spin .8s linear infinite;transform-origin:50% 50%}
.a-draw{stroke-dasharray:60;animation:draw .7s cubic-bezier(.3,.7,.2,1) both}
.a-pop{animation:pop .42s cubic-bezier(.3,.7,.2,1) both}
.a-fadeup{animation:fadeUp .36s ease-out both}
.a-fadein{animation:fadeIn .4s ease-out both}
.a-rise{animation:rise .5s cubic-bezier(.3,.7,.2,1) both}
.a-leave{animation:leave .32s ease-in both}
.a-pulse{animation:pulse 1.6s ease-in-out infinite}
.d1{animation-delay:.12s}
.d2{animation-delay:.25s}
.d3{animation-delay:.4s}
.d4{animation-delay:.55s}
.rm *{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition:none !important}
@media (prefers-reduced-motion: reduce){.t *{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition:none !important}}

</helmet>
<div class="{{rootCls}}" style="position: relative; width: 390px; height: 844px; background: var(--bg); color: var(--ink); overflow: hidden; font-size: 14px; line-height: 1.5">

<sc-if value="{{showApp}}" hint-placeholder-val="{{ false }}">
<div class="a-fadein" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<header style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 60px; padding: 8px 8px 0; border-bottom: 1px solid var(--line)">
<button aria-label="Open menu" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--ink2); display: grid; place-items: center"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
<div style="flex-grow: 1; min-width: 0; line-height: 1.25; padding-left: 2px"><div style="font-size: 15px; font-weight: 600">New chat</div><div style="font-size: 12px; color: var(--ink3)">My library</div></div>
<button aria-label="Chat model: Qwen3 30B, ready" style="height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink2); font-size: 12.5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--ok)"></span>Qwen3 30B</button>
<span style="width: 6px"></span>
</header>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 24px 40px; gap: 10px">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 36px; font-weight: 400; letter-spacing: -0.015em; line-height: 1.12">Ask your sources.</h1>
<p style="margin: 0; font-size: 14px; color: var(--ink2)">3 sources in My library · answers cite them</p>
</div>
<div style="flex-shrink: 0; padding: 8px 12px 26px">
<div style="border: 1px solid var(--line2); border-radius: 20px; background: var(--surf); box-shadow: var(--shadow)">
<textarea aria-label="Ask a question" placeholder="Ask anything…" rows="1" style="display: block; width: 100%; height: 50px; padding: 15px 16px 0; border: 0; background: transparent; color: var(--ink); font-size: 16px; resize: none; outline: none"></textarea>
<div style="display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px">
<button aria-label="Mode: Auto" style="height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--ink); font-size: 13.5px; font-weight: 500"><svg class="i" viewBox="0 0 24 24" style="width: 15px; height: 15px; color: var(--acc-text)"><circle cx="6" cy="6" r="2.2"></circle><circle cx="18" cy="18" r="2.2"></circle><path d="M8.2 6H15a3 3 0 010 6H9a3 3 0 000 6h6.8"></path></svg>Auto</button>
<span style="flex-grow: 1"></span>
<button aria-label="Send" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center"><svg class="i" viewBox="0 0 24 24" style="width: 19px; height: 19px; stroke-width: 2"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</div>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{showIntro}}" hint-placeholder-val="{{ true }}">
<div class="{{introCls}}" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 20px 70px; background: var(--bg)">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
<div class="a-rise" style="position: relative; width: 64px; height: 64px; border-radius: 17px; background: var(--ink); color: var(--bg); display: grid; place-items: center">
<svg class="i" viewBox="0 0 24 24" style="width: 36px; height: 36px; stroke-width: 1.5"><path class="a-draw d1" d="M6.5 4h7l4 4v12h-11z"></path><path class="a-draw d3" d="M13.5 4v4h4M9.5 12.5h5M9.5 15.5h3"></path></svg>
<span class="a-pop d4" style="position: absolute; right: -6px; bottom: -6px; width: 21px; height: 21px; border-radius: 50%; background: var(--acc); border: 4px solid var(--bg)"></span>
</div>
<div class="a-fadeup d2" style="font-size: 21px; font-weight: 600; letter-spacing: -0.015em">AgenticRAG</div>
</div>

<div class="a-fadeup d3" style="width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 6px; border: 1px solid var(--line); border-radius: 16px; background: var(--surf)">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 12px; border-radius: 10px">
<span style="width: 18px; height: 18px; display: grid; place-items: center; flex-shrink: 0">
<sc-if value="{{r.isWait}}" hint-placeholder-val="{{ true }}"><span style="width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line2)"></span></sc-if>
<sc-if value="{{r.isRun}}" hint-placeholder-val="{{ false }}"><svg class="i a-spin" viewBox="0 0 24 24" style="width: 17px; height: 17px; color: var(--acc-text); stroke-width: 2"><path d="M12 3a9 9 0 019 9"></path></svg></sc-if>
<sc-if value="{{r.isOk}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" style="width: 17px; height: 17px; color: var(--ok); stroke-width: 2.2"><path class="a-draw" d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
<sc-if value="{{r.isFail}}" hint-placeholder-val="{{ false }}"><svg class="i a-pop" viewBox="0 0 24 24" style="width: 17px; height: 17px; color: var(--err); stroke-width: 2.2"><path d="M7 7l10 10M17 7L7 17"></path></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 14.5px; font-weight: 500; color: {{r.nameColor}}">{{r.name}}</span><span style="font-size: 12px; color: var(--ink3)">{{r.sub}}</span></span>
<span style="flex-grow: 1"></span>
<span class="mono" style="font-size: 12px; color: {{r.detailColor}}">{{r.detail}}</span>
</div>
</sc-for>
</div>

<div style="width: 100%; min-height: 128px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div role="status" style="font-size: 14px; text-align: center; color: {{statusColor}}">{{status}}</div>
<sc-if value="{{isMacFail}}" hint-placeholder-val="{{ false }}">
<div class="a-fadeup" style="width: 100%; display: flex; flex-direction: column; gap: 8px">
<a href="PhoneOffline.dc.html" class="btn btn-pri btn-lg">Continue offline</a>
<button class="btn btn-sec btn-lg" onClick="{{replay}}">Try again</button>
</div>
</sc-if>
<sc-if value="{{isRtFail}}" hint-placeholder-val="{{ false }}">
<div class="a-fadeup" style="width: 100%; display: flex; flex-direction: column; gap: 8px">
<a href="RuntimeDown.dc.html" class="btn btn-pri btn-lg">Open anyway</a>
<button class="btn btn-sec btn-lg" onClick="{{replay}}">Try again</button>
</div>
</sc-if>
</div>
</div>
</sc-if>

<button class="btn btn-ghost" onClick="{{replay}}" aria-label="Replay the launch intro" style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); height: 32px; font-size: 12.5px"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="M4 12a8 8 0 1 0 2.4-5.7"></path><path d="M4 4v4.5h4.5"></path></svg>Replay intro</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"outcome":{"editor":"enum","options":["healthy","cold model","runtime down","mac offline"],"default":"healthy"},"runtime":{"editor":"enum","options":["LM Studio","Ollama"],"default":"LM Studio"},"theme":{"editor":"enum","options":["dark","midnight","light","paper"],"default":"midnight"},"accent":{"editor":"enum","options":["cobalt","amber","mono"],"default":"cobalt"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.start(); }
  componentDidUpdate(prev) { if (prev.outcome !== this.props.outcome) this.start(); }
  componentWillUnmount() { this.clear(); }

  at(ms, patch) { var self = this; this.timers.push(setTimeout(function () { self.setState(patch); }, ms)); }
  start() {
    this.clear();
    var o = this.props.outcome || 'healthy';
    this.setState({ r1: 'wait', r2: 'wait', r3: 'wait', elapsed: 0, done: false, leaving: false, app: false, fail: null });
    this.at(380, { r1: 'run' });
    if (o === 'mac offline') { this.at(2380, { r1: 'fail' }); this.at(2600, { fail: 'mac' }); return; }
    this.at(760, { r1: 'ok', r2: 'run' });
    if (o === 'runtime down') { this.at(2760, { r2: 'fail' }); this.at(2980, { fail: 'runtime' }); return; }
    var t = 1100;
    if (o === 'cold model') { for (var s = 1; s <= 5; s++) { this.at(760 + s * 1000, { elapsed: s }); } t = 6100; }
    this.at(t, { r2: 'ok', r3: 'run' });
    this.at(t + 260, { r3: 'ok' });
    this.at(t + 460, { done: true });
    this.at(t + 900, { leaving: true });
    this.at(t + 1220, { app: true });
  }
  renderVals() {
    var s = this.state || {};
    var theme = this.props.theme || 'midnight';
    var accent = this.props.accent || 'cobalt';
    var runtime = this.props.runtime || 'LM Studio';
    var o = this.props.outcome || 'healthy';
    var fam = (theme === 'light' || theme === 'paper') ? 'fam-light' : 'fam-dark';
    function row(state, name, sub, run, ok, fail) {
      return {
        name: name, sub: sub,
        isWait: state === 'wait', isRun: state === 'run', isOk: state === 'ok', isFail: state === 'fail',
        detail: state === 'run' ? run : state === 'ok' ? ok : state === 'fail' ? fail : '',
        nameColor: state === 'wait' ? 'var(--ink3)' : 'var(--ink)',
        detailColor: state === 'fail' ? 'var(--err)' : state === 'ok' ? 'var(--ink3)' : 'var(--ink2)'
      };
    }
    var r2run = o === 'cold model' ? (s.elapsed ? 'loading · ' + s.elapsed + ' s' : 'loading') : 'checking';
    var rows = [
      row(s.r1 || 'wait', 'Mac mini', 'on your tailnet', 'connecting', '41 ms', 'no response'),
      row(s.r2 || 'wait', 'Qwen3 30B', runtime, r2run, 'ready', 'not responding'),
      row(s.r3 || 'wait', 'My library', 'sources', 'opening', '3 ready', '')
    ];
    var status = 'Connecting to your Mac mini…';
    var statusColor = 'var(--ink2)';
    if (s.r1 === 'ok') status = 'Checking the model…';
    if (o === 'cold model' && s.r2 === 'run') status = 'Loading Qwen3 30B into memory. This happens after a restart.';
    if (s.r2 === 'ok') status = 'Opening My library…';
    if (s.done) status = 'Ready';
    if (s.fail === 'mac') { status = 'Can’t reach your Mac mini'; statusColor = 'var(--ink)'; }
    if (s.fail === 'runtime') { status = runtime + ' isn’t responding on your Mac mini'; statusColor = 'var(--ink)'; }
    var self = this;
    return {
      rootCls: 't theme-' + theme + ' ' + fam + ' acc-' + accent + ' read-serif',
      rows: rows, status: status, statusColor: statusColor,
      showIntro: !s.app, showApp: !!s.app, introCls: s.leaving ? 'a-leave' : '',
      isMacFail: s.fail === 'mac', isRtFail: s.fail === 'runtime',
      replay: function () { self.start(); }
    };
  }
}
</script>
</body>
