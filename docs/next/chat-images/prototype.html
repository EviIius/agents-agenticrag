<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Atelier chat images and working indicator: reference prototype. Fake data only. See CHAT-IMAGES-SPEC.md; where they differ, the spec wins. -->
<title>Atelier Chat Images</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Layout: Atelier shell (sidebar | chat). Thread column 768px; composer pinned at the bottom.
   Tokens copied from web/src/styles/globals.css. Motion follows Phase 4 limits (200 ms small, 320 ms large). */
:root {
  --bg: #faf9f6; --bg-sidebar: #f2f1ec; --surface: #ffffff; --surface-2: #f0efea; --surface-3: #e8e6e0;
  --user-bubble: #efede7;
  --line: #e4e2dc; --line-strong: #d2cfc7; --line-input: #8e8a82;
  --text: #1d1c1a; --text-2: #57544e; --text-3: #6a665f;
  --brand: #2f5bea; --brand-hover: #2448c4; --brand-soft: #e8eefe; --on-brand: #ffffff;
  --success: #1d7a4b; --warning: #8a5a00; --danger: #b42318;
  --overlay: rgb(29 28 26 / 0.32); --viewer-bg: rgb(20 20 18 / 0.92);
  --blob-warm: #f3c9a6;
  --shadow-sm: 0 1px 2px rgb(20 20 18 / 0.05);
  --shadow-md: 0 1px 3px rgb(20 20 18 / 0.06), 0 6px 20px rgb(20 20 18 / 0.08);
  --shadow-lg: 0 2px 6px rgb(20 20 18 / 0.06), 0 16px 48px rgb(20 20 18 / 0.14);
  --shadow-composer: 0 1px 2px rgb(20 20 18 / 0.04), 0 4px 24px -6px rgb(20 20 18 / 0.1);
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-reading: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-code: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 22px;
  --dur-instant: 80ms; --dur-fast: 120ms; --dur-med: 200ms; --dur-slow: 320ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1); --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-pop: cubic-bezier(0.34, 1.4, 0.64, 1);
  --sidebar-w: 272px; --topbar-h: 52px; --thread-w: 768px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1b1a; --bg-sidebar: #151514; --surface: #232322; --surface-2: #2b2b29; --surface-3: #34332f;
  --user-bubble: #2a2a28;
  --line: #33322f; --line-strong: #45433f; --line-input: #7a766e;
  --text: #eceae5; --text-2: #b4b0a8; --text-3: #9c978e;
  --brand: #7c9dff; --brand-hover: #93aeff; --brand-soft: #24304f; --on-brand: #0d1430;
  --success: #5fd394; --warning: #f2b455; --danger: #ff8a7a;
  --overlay: rgb(0 0 0 / 0.55); --viewer-bg: rgb(10 10 9 / 0.94);
  --blob-warm: #6b4a35;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
  --shadow-md: 0 1px 3px rgb(0 0 0 / 0.35), 0 8px 24px rgb(0 0 0 / 0.35);
  --shadow-lg: 0 2px 6px rgb(0 0 0 / 0.4), 0 20px 56px rgb(0 0 0 / 0.5);
  --shadow-composer: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 28px -6px rgb(0 0 0 / 0.5);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1b1b1a; --bg-sidebar: #151514; --surface: #232322; --surface-2: #2b2b29; --surface-3: #34332f;
  --user-bubble: #2a2a28;
  --line: #33322f; --line-strong: #45433f; --line-input: #7a766e;
  --text: #eceae5; --text-2: #b4b0a8; --text-3: #9c978e;
  --brand: #7c9dff; --brand-hover: #93aeff; --brand-soft: #24304f; --on-brand: #0d1430;
  --success: #5fd394; --warning: #f2b455; --danger: #ff8a7a;
  --overlay: rgb(0 0 0 / 0.55); --viewer-bg: rgb(10 10 9 / 0.94);
  --blob-warm: #6b4a35;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
  --shadow-md: 0 1px 3px rgb(0 0 0 / 0.35), 0 8px 24px rgb(0 0 0 / 0.35);
  --shadow-lg: 0 2px 6px rgb(0 0 0 / 0.4), 0 20px 56px rgb(0 0 0 / 0.5);
  --shadow-composer: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 28px -6px rgb(0 0 0 / 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.meta { font-size: 12px; color: var(--text-3); }

/* Shell */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; overflow: hidden; }
.sidebar { background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 8px; min-width: 0; overflow: hidden; }
.sb-head { display: flex; align-items: center; gap: 4px; height: 44px; }
.sb-name { flex: 1; font-weight: 500; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-sm); color: var(--text-2); transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn[aria-pressed="true"] { color: var(--brand); }
.sb-search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; margin: 4px 0 8px; border-radius: var(--radius-md); background: var(--surface-2); color: var(--text-3); }
.sb-search span { flex: 1; }
.nav-row { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: var(--radius-md); border: 0; background: transparent; width: 100%; text-align: left; color: var(--text); transition: background-color var(--dur-fast) var(--ease); }
.nav-row:hover { background: var(--surface-2); }
.sb-label { font-size: 11px; letter-spacing: .06em; color: var(--text-3); padding: 18px 12px 6px; }
.sb-chats { flex: 1; overflow: auto; min-height: 0; }
.chat-row { display: block; padding: 9px 12px; border-radius: var(--radius-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.chat-row:hover { background: var(--surface-2); }
.chat-row.on { background: var(--surface-3); box-shadow: inset 2px 0 0 var(--brand); }
.sb-foot { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.proto { padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 8px; }
.proto .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--text-2); }
.main { min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.topbar { height: var(--topbar-h); display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; flex-shrink: 0; }
.model-pick { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; padding: 6px 8px; border-radius: var(--radius-sm); min-width: 0; }
.model-pick b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model-pick .live { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--success); flex-shrink: 0; }
.phone-menu { display: none; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-md); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 0 10px; height: 28px; border-radius: 8px; color: var(--text-2); font-size: 12.5px; transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* Thread */
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.thread { max-width: var(--thread-w); margin: 0 auto; padding-block: 8px 220px; padding-inline: 24px; display: flex; flex-direction: column; gap: 28px; }
.u-row { display: flex; justify-content: flex-end; }
.bubble { max-width: 80%; background: var(--user-bubble); border-radius: 18px; padding: 10px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble .tag { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
.bubble .tag svg.i { width: 13px; height: 13px; }
.fresh { animation: rise var(--dur-med) var(--ease-out) both; }
.a-row { display: flex; flex-direction: column; min-width: 0; }
.a-model { font-size: 12px; color: var(--text-3); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.answer { font: 17px/1.65 var(--font-reading); }
.answer p { margin: 0 0 12px; }
.answer ul { margin: 0 0 12px; padding-left: 22px; }
.answer li { margin: 4px 0; }
.answer strong { font-weight: 500; }
.answer .w { animation: word-in var(--dur-med) var(--ease-out) both; }
.answer.streaming > :last-child::after { content: "▍"; color: var(--text-3); margin-left: 2px; animation: caret 1s steps(1) infinite; font-family: var(--font-ui); }
.actions { display: flex; align-items: center; gap: 2px; margin-top: 6px; margin-left: -8px; color: var(--text-3); }
.actions .icon-btn { width: 32px; height: 32px; color: var(--text-3); }
.actions .txt-btn { height: 32px; padding: 0 10px; border: 0; background: transparent; border-radius: var(--radius-sm); color: var(--text-2); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.actions .txt-btn:hover { background: var(--surface-2); color: var(--text); }
.branch { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; margin-right: 6px; }
.branch .icon-btn { width: 26px; height: 26px; }

/* Working line (Part B) */
.working { display: flex; align-items: center; gap: 10px; min-height: 32px; overflow: hidden; }
.working.pop { animation: pop 120ms var(--ease-pop) both; }
.wl-label { position: relative; display: inline-grid; overflow: hidden; color: var(--text-2); font-size: 14px; }
.wl-label > span { grid-area: 1 / 1; white-space: nowrap; }
.wl-label .in { animation: word-in var(--dur-med) var(--ease-out) both; }
.wl-label .out { animation: word-out var(--dur-fast) var(--ease-in) both; }
.wl-label::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--surface-3), transparent); opacity: .2; animation: shimmer 1.6s linear infinite; pointer-events: none; }
.wl-time { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.wl-chev { margin-left: auto; color: var(--text-3); width: 28px; height: 28px; }
.ticker { display: flex; justify-content: flex-end; overflow: hidden; height: 20px; margin: 0 0 4px 28px; border: 0; background: transparent; padding: 0; width: calc(100% - 28px); cursor: pointer; color: var(--text-3); font-size: 13px; line-height: 20px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px); mask-image: linear-gradient(90deg, transparent, #000 24px); text-align: left; }
.ticker span { white-space: nowrap; }
.thoughts { margin: 4px 0 8px 28px; max-height: 240px; overflow: auto; font-size: 13.5px; line-height: 1.6; color: var(--text-2); white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 12px; }
.collapsing { animation: collapse var(--dur-med) var(--ease-out) both; }
.thought-row { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; border: 1px solid var(--line); border-radius: var(--radius-md); background: transparent; color: var(--text-2); font-size: 13px; margin-bottom: 12px; align-self: flex-start; animation: rise var(--dur-med) var(--ease-out) both; }
.thought-row:hover { border-color: var(--line-strong); }
.thought-row svg.chev { transition: transform var(--dur-fast) var(--ease); }
.thought-row[aria-expanded="true"] svg.chev { transform: rotate(180deg); }
.steps { display: flex; flex-direction: column; gap: 4px; margin: 2px 0 8px 28px; font-size: 13px; color: var(--text-2); }
.steps div { display: flex; align-items: center; gap: 8px; animation: rise var(--dur-fast) var(--ease-out) both; }
.steps .ok { color: var(--success); }

/* The mark */
.mark { width: 18px; height: 18px; color: var(--brand); flex-shrink: 0; display: inline-grid; }
.mark svg { width: 18px; height: 18px; overflow: visible; }
.mark .ma, .mark .mb { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.mark .mb { opacity: 0; }
.mark.draw .mb { opacity: .22; }
.mark .md { fill: currentColor; transform-box: fill-box; transform-origin: center; }
.mark.draw .ma { animation: mark-draw 1.8s var(--ease-out) infinite; }
.mark.draw .md { animation: mark-dot-drop 1.8s var(--ease-out) infinite; }
.mark.think .md { animation: mark-dot-bob 1.2s ease-in-out infinite; }

/* Image card (Part A) */
.frames { display: grid; gap: 8px; }
.frames.c1 { grid-template-columns: minmax(0, 440px); }
.frames.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 640px; }
.frames.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.frame { position: relative; aspect-ratio: 1; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.frame .field { position: absolute; inset: 0; transition: opacity var(--dur-med) var(--ease); }
.frame .field i { position: absolute; width: 70%; height: 70%; border-radius: 50%; filter: blur(28px); opacity: .9; }
.frame .field i:nth-child(1) { background: var(--brand); left: -10%; top: -5%; animation: drift-a 7s ease-in-out infinite alternate; }
.frame .field i:nth-child(2) { background: var(--brand-soft); right: -15%; top: 25%; animation: drift-b 9s ease-in-out infinite alternate; }
.frame .field i:nth-child(3) { background: var(--blob-warm); left: 15%; bottom: -20%; animation: drift-c 11s ease-in-out infinite alternate; }
.frame[data-s="queued"] .field i, .frame[data-s="failed"] .field i, .frame[data-s="cancelled"] .field i { animation-play-state: paused; opacity: .25; }
.frame[data-s="cancelling"] .field i { animation-play-state: paused; }
.frame[data-s="cancelled"] .field, .frame[data-s="failed"] .field, .frame[data-s="interrupted"] .field { opacity: .45; }
.frame[data-s="decoding"] .field { opacity: 1; }
.frame[data-s="preparing"] .field, .frame[data-s="running"] .field { opacity: .85; }
.frame .grain { position: absolute; inset: 0; opacity: .08; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); pointer-events: none; }
.frame .sheen { position: absolute; inset: 0; overflow: hidden; pointer-events: none; display: none; }
.frame .sheen::before { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .09), transparent); animation: sheen 2.4s var(--ease) infinite; }
.frame[data-s="preparing"] .sheen { display: block; }
.frame .bar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; transition: opacity var(--dur-med) var(--ease); }
.frame .bar b { height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--surface-3) 60%, transparent); overflow: hidden; display: block; }
.frame .bar b::after { content: ""; display: block; height: 100%; width: 0; background: var(--brand); border-radius: 2px; transition: width var(--dur-slow) var(--ease-out); }
.frame .bar b.on::after { width: 100%; }
.frame[data-s="queued"] .bar, .frame[data-s="complete"] .bar, .frame[data-s="failed"] .bar, .frame[data-s="cancelled"] .bar { opacity: 0; }
.frame .label { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--text-2); background: color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 999px; padding: 1px 8px; }
.frame .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; font-size: 13px; color: var(--text-2); }
.frame .msg .btn-sm { margin-top: 8px; }
.frame img, .frame canvas.out { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.frame .pic { position: absolute; inset: 0; opacity: 0; }
.frame[data-s="complete"] .pic { opacity: 1; }
.frame .pic.reveal { animation: reveal var(--dur-slow) var(--ease-out) both; }
.frame[data-s="complete"] .field { opacity: 0; }
.frame[data-s="complete"] { cursor: zoom-in; }
.frame .tools { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 2px; justify-content: flex-end; padding: 28px 8px 8px; background: linear-gradient(transparent, rgb(0 0 0 / .45)); opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
.frame[data-s="complete"]:hover .tools, .frame[data-s="complete"]:focus-within .tools { opacity: 1; }
.frame .tools button { width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgb(20 20 18 / .55); color: #fff; display: grid; place-items: center; }
.frame .tools button:hover { background: rgb(20 20 18 / .8); }
.under-tools { display: none; }
.img-status { display: flex; align-items: center; gap: 10px; min-height: 32px; margin-top: 8px; color: var(--text-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.btn-sm { height: 30px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 500; }
.btn-sm:hover { background: var(--surface-2); }
.dots { display: none; justify-content: center; gap: 6px; margin-top: 8px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); transition: background-color var(--dur-fast) var(--ease); }
.dots i.on { background: var(--text-2); }

/* Composer */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 24px 20px; background: linear-gradient(transparent, var(--bg) 28px); pointer-events: none; }
.composer { pointer-events: auto; max-width: var(--thread-w); margin: 0 auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-xl); box-shadow: var(--shadow-composer); padding: 12px 12px 10px; transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.composer.img { border-color: color-mix(in srgb, var(--brand) 45%, var(--line-strong)); box-shadow: var(--shadow-composer), 0 0 0 3px color-mix(in srgb, var(--brand) 10%, transparent); }
.ref-chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px 4px 4px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-2); font-size: 12.5px; color: var(--text-2); margin: 0 0 8px 2px; animation: rise var(--dur-fast) var(--ease-out) both; }
.ref-chip canvas, .ref-chip img { width: 28px; height: 28px; border-radius: 6px; display: block; }
.ref-chip .icon-btn { width: 24px; height: 24px; }
.composer textarea { width: 100%; border: 0; outline: none; resize: none; background: transparent; min-height: 28px; max-height: 200px; padding: 4px 6px 12px; line-height: 1.5; font-size: 15px; display: block; }
.composer textarea::placeholder { color: var(--text-3); }
.c-row { display: flex; align-items: center; gap: 4px; min-height: 34px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; border: 0; background: transparent; color: var(--text-2); font-size: 13px; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease); }
.pill:hover { background: var(--surface-2); color: var(--text); }
.pill[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }
.pill.img-on { background: var(--brand-soft); color: var(--brand); padding-right: 6px; }
.pill.img-on .x { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; }
.pill.img-on .x:hover { background: color-mix(in srgb, var(--brand) 20%, transparent); }
.pill.opt { border: 1px solid var(--line); }
.chat-only, .img-only { display: contents; }
.composer.img .chat-only > * { display: none; }
.composer:not(.img) .img-only > * { display: none; }
.img-only > * { animation: fade-in var(--dur-fast) var(--ease-out) both; }
.engine { margin-left: auto; font-size: 12px; color: var(--text-3); white-space: nowrap; padding-right: 6px; }
.send { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; margin-left: auto; transition: transform var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease); flex-shrink: 0; }
.composer.img .send { margin-left: 0; }
.send:disabled { background: var(--surface-3); color: var(--text-3); cursor: default; }
.send:active:not(:disabled) { transform: scale(0.94); }

  const pal = /night|moon|star/.test(p) ? ["#0e1530", "#2a2f6b", "#7c6fb0", "#f4e9c8", "#151a33"] : /sunset|dusk|golden|warm|evening/.test(p) ? ["#2b1e3f", "#c4566b", "#f6a35c", "#fff1c4", "#3a2238"] : /winter|snow|cold/.test(p) ? ["#9fb6d6", "#d9e4f2", "#f6f8fb", "#ffffff", "#6f86a6"] : /forest|garden|green/.test(p) ? ["#1d3b2f", "#4f7a55", "#a9c79a", "#f2f0d8", "#16261f"] : /dawn|morning|fog|mist/.test(p) ? ["#6d7fa6", "#c9b8c8", "#f3d2b8", "#fff4e0", "#4b5878"] : ["#2f5bea", "#7c9dff", "#f3c9a6", "#fff3e6", "#1f2a52"];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(0.8, pal[2]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (/night|moon|star/.test(p)) for (let i = 0; i < 140; i++) { ctx.fillStyle = `rgba(255,255,240,${0.3 + r() * 0.6})`; ctx.fillRect(r() * W, r() * H * 0.55, 1.4, 1.4); }
  const sx = W * (0.25 + r() * 0.5), sy = H * (0.28 + r() * 0.14), sr = W * (0.06 + r() * 0.04);
  const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 6); glow.addColorStop(0, pal[3] + "cc"); glow.addColorStop(1, pal[3] + "00"); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = pal[3]; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  const water = /harbor|harbour|lake|sea|ocean|water|river|quay/.test(p); const horizon = water ? H * 0.64 : H;
  const mix = (a, b, t) => { const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16); const c = [16, 8, 0].map((s) => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t)); return `rgb(${c.join(",")})`; };
  for (let l = 0; l < 4; l++) {
    const base = horizon - H * (0.34 - l * 0.075); const amp = H * (0.05 + l * 0.02); const f1 = 1 + r() * 3, f2 = 3 + r() * 5, ph = r() * 6;
    ctx.fillStyle = mix(pal[2], pal[4], 0.25 + l * 0.22); ctx.beginPath(); ctx.moveTo(0, horizon);
    for (let x = 0; x <= W; x += 4) { const t = x / W; ctx.lineTo(x, base - Math.sin(t * f1 * 3.1 + ph) * amp - Math.sin(t * f2 * 3.1 + ph * 2) * amp * 0.35); }
    ctx.lineTo(W, horizon); ctx.closePath(); ctx.fill();
  }
  if (water) {
    const wg = ctx.createLinearGradient(0, horizon, 0, H); wg.addColorStop(0, mix(pal[2], pal[1], 0.4)); wg.addColorStop(1, pal[4]); ctx.fillStyle = wg; ctx.fillRect(0, horizon, W, H - horizon);
    for (let i = 0; i < 70; i++) { const y = horizon + r() * (H - horizon); const w = 10 + r() * 60; ctx.fillStyle = `rgba(255,245,220,${0.05 + r() * 0.15})`; ctx.fillRect(sx - w / 2 + (r() - 0.5) * W * 0.3, y, w, 1.2); }
    for (let m = 0; m < 3 + Math.floor(r() * 3); m++) { const bx = W * (0.1 + r() * 0.8), by = horizon + H * (0.03 + r() * 0.12); ctx.fillStyle = pal[4]; ctx.beginPath(); ctx.moveTo(bx - 26, by); ctx.lineTo(bx + 26, by); ctx.lineTo(bx + 18, by + 9); ctx.lineTo(bx - 18, by + 9); ctx.closePath(); ctx.fill(); ctx.fillRect(bx - 1, by - 44, 2, 44); }
  }
  if (/lantern|light|window/.test(p)) for (let i = 0; i < 18; i++) { const lx = r() * W, ly = horizon + (water ? r() * (H - horizon) * 0.8 : -r() * H * 0.2); const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 14); lg.addColorStop(0, "rgba(255,196,110,0.95)"); lg.addColorStop(1, "rgba(255,170,80,0)"); ctx.fillStyle = lg; ctx.fillRect(lx - 14, ly - 14, 28, 28); }
  if (/fog|mist|haze/.test(p)) { const fg = ctx.createLinearGradient(0, H * 0.35, 0, H * 0.75); fg.addColorStop(0, "rgba(255,255,255,0)"); fg.addColorStop(0.5, "rgba(255,255,255,0.28)"); fg.addColorStop(1, "rgba(255,255,255,0)"); ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H); }
  if (/snow/.test(p)) for (let i = 0; i < 260; i++) { ctx.fillStyle = `rgba(255,255,255,${0.4 + r() * 0.5})`; ctx.beginPath(); ctx.arc(r() * W, r() * H, 0.6 + r() * 1.6, 0, Math.PI * 2); ctx.fill(); }
  const img = ctx.getImageData(0, 0, W, H); const d = img.data; for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; } ctx.putImageData(img, 0, 0);

}

    await sleep(1200); steps.insertAdjacentHTML("beforeend", `<div>${ico("check", "width:14px").replace('class="i"', 'class="i ok"')}Searched the web · 3 queries</div>`);
    setLabel(st, "Reading 4 pages"); await sleep(1500); steps.insertAdjacentHTML("beforeend", `<div>${ico("check", "width:14px").replace('class="i"', 'class="i ok"')}Read 4 pages</div>`);
  }

    await sleep(300);

  const secs = Math.max(1, Math.round((Date.now() - tStart) / 1000));

  const ans = document.createElement("div"); ans.className = "answer streaming"; row.appendChild(ans);

async function pump() {

  for (let s = 0; s <= 4; s++) { if (img.state === "cancelled") break; img.state = "running"; img.step = s; tick(); if (s < 4) await sleep(1100); }
  if (img.state !== "cancelled") { img.decoding = true; tick(); await sleep(650); img.decoding = false; img.state = "complete"; img.t1 = Date.now(); updateFrame(img); attachPic(img, true); }
  running = false; tick(); queue.forEach((q) => { const o = images.get(q); updateTurnStatus(o.turn); }); scrollDown(); pump();
}

/* ---------- Composer ---------- */
function setImageMode(on, opts = {}) {
  if (on === imageMode && !opts.force) return;
  if (on) { chatDraft = input.value; imageMode = true; input.value = opts.prompt ?? (imageDraft || "A quiet harbor at dawn, paper lanterns on the water, soft fog"); input.placeholder = "Describe an image…"; }
  else { imageDraft = input.value; imageMode = false; refine = null; renderRef(); input.value = chatDraft; input.placeholder = `Message ${MODEL}…`; }
  $("#composer").classList.toggle("img", imageMode); $("#send").setAttribute("aria-label", imageMode ? "Create image" : "Send");
  autosize(); updateSend(); input.focus(); const v = input.value.length; input.setSelectionRange(v, v);
}
function renderRef() {
  const r = $("#ref"); if (!refine) { r.innerHTML = ""; return; }
  r.innerHTML = `<span class="ref-chip"><img alt="" src="${refine.url}">Refining image ${refine.index + 1} · seed ${refine.seed}<button type="button" class="icon-btn" data-act="ref-off" aria-label="Stop refining">${ico("x", "width:12px")}</button></span>`;
}
function updateSend() { $("#send").disabled = !input.value.trim() || (!imageMode && busyText); $("#count-btn").firstChild.textContent = `${count} image${count > 1 ? "s" : ""}`; }
function autosize() { input.style.height = "auto"; input.style.height = Math.min(200, input.scrollHeight) + "px"; }
input.addEventListener("input", () => {
  if (!imageMode && /^\/image\s/.test(input.value)) { const rest = input.value.replace(/^\/image\s/, ""); input.value = ""; setImageMode(true, { prompt: rest }); }
  autosize(); updateSend();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); }
  if (e.key === "Escape" && imageMode && !input.value) setImageMode(false);
});
$("#composer").addEventListener("submit", (e) => {
  e.preventDefault(); const text = input.value.trim(); if (!text) return;
  $("#hint").textContent = imageMode ? "Images run one at a time on your Mac. Click a finished image to open it." : "Try Search, or turn Think off, then send again.";
  if (imageMode) { imageTurn(text, count, refine && refine.id); imageDraft = ""; input.value = ""; refine = null; renderRef(); }
  else { if (busyText) return; input.value = ""; chatDraft = ""; sendText(text); }
  autosize(); updateSend();
});

/* ---------- Menus / toasts ---------- */
function closeMenus() { $$(".menu").forEach((m) => m.remove()); }
function openMenu(anchor, html, cls = "") { closeMenus(); const m = document.createElement("div"); m.className = "menu " + cls; m.innerHTML = html; document.body.appendChild(m); const r = anchor.getBoundingClientRect(); const W = m.offsetWidth, H = m.offsetHeight; let top = r.top - H - 6; if (top < 8) top = r.bottom + 6; m.style.left = Math.max(8, Math.min(r.left, innerWidth - W - 8)) + "px"; m.style.top = top + "px"; return m; }
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; $("#toasts").appendChild(el); setTimeout(() => el.remove(), 3000); }
function imgFromEvent(t) { const fr = t.closest(".frame"); if (fr) return images.get(fr.dataset.id); const ut = t.closest(".under-tools"); if (ut) { const turn = ut.closest(".a-row")._turn; const frames = turn.row.querySelector(".frames"); const idx = frames.classList.contains("c3") ? Math.round(frames.scrollLeft / (frames.firstElementChild.offsetWidth + 8)) : 0; return images.get(turn.versions[turn.v][idx]); } return viewerImg(); }

/* ---------- Viewer (spec A6) ---------- */
let vList = [], vIdx = 0, vEl = null;
const viewerImg = () => vList.length ? images.get(vList[vIdx]) : null;
function allImagesInChat() { const ids = []; $$(".frame[data-s='complete']", thread).forEach((f) => ids.push(f.dataset.id)); return ids; }
function fitRect(stage) { const r = stage.getBoundingClientRect(); const m = innerWidth < 768 ? 16 : 24; const size = Math.min(r.width - m * 2, r.height - m * 2); return { left: r.left + (r.width - size) / 2, top: r.top + (r.height - size) / 2, size }; }
function openViewer(id) {
  vList = allImagesInChat(); vIdx = Math.max(0, vList.indexOf(id)); const V = $("#viewer"); V.hidden = false; V.classList.remove("closing");
  const stage = $("#v-stage"); if (vEl) vEl.remove(); vEl = document.createElement("img"); vEl.className = "vimg"; stage.appendChild(vEl);
  showViewer(true);
  $("[data-act='viewer-close']", V.querySelector(".vbar")).focus({ preventScroll: true });
}
function showViewer(fromFrame) {
  const img = viewerImg(); const stage = $("#v-stage"); const sr = stage.getBoundingClientRect(); const fr = fitRect(stage);
  $("#v-prompt").textContent = img.prompt; $("#v-pos").textContent = vList.length > 1 ? `${vIdx + 1} / ${vList.length}` : ""; $$(".nav", stage).forEach((b) => (b.hidden = vList.length < 2));
  vEl.src = img.url; vEl.alt = img.prompt; vEl.style.width = vEl.style.height = fr.size + "px"; vEl.style.left = fr.left - sr.left + "px"; vEl.style.top = fr.top - sr.top + "px";
  const frame = $(`.frame[data-id="${img.id}"]`);
  if (fromFrame && frame && !reduced()) {
    const r = frame.getBoundingClientRect(); const s = r.width / fr.size;
    vEl.classList.remove("anim"); vEl.style.transform = `translate(${r.left - fr.left}px, ${r.top - fr.top}px) scale(${s})`; vEl.style.borderRadius = 14 / s + "px";
    void vEl.offsetWidth; vEl.classList.add("anim"); vEl.style.transform = "none"; vEl.style.borderRadius = "6px";
  } else { vEl.style.transform = "none"; }
}
function stepViewer(d) {
  if (vList.length < 2) return; vIdx = (vIdx + d + vList.length) % vList.length;
  if (reduced()) { showViewer(false); return; }
  vEl.classList.remove("anim"); vEl.classList.add("swap"); vEl.style.opacity = "0"; vEl.style.transform = `translateX(${-24 * d}px)`;
  setTimeout(() => { vEl.classList.remove("swap"); showViewer(false); vEl.style.transform = `translateX(${24 * d}px)`; void vEl.offsetWidth; vEl.classList.add("swap"); vEl.style.opacity = "1"; vEl.style.transform = "none"; }, 160);
}
function closeViewer() {
  const V = $("#viewer"); if (V.hidden) return; const img = viewerImg(); const frame = img && $(`.frame[data-id="${img.id}"]`);
  const finish = () => { V.hidden = true; V.classList.remove("closing"); if (vEl) { vEl.remove(); vEl = null; } if (frame) frame.focus({ preventScroll: true }); };
  if (reduced() || !frame) { finish(); return; }
  frame.scrollIntoView({ block: "nearest" });
  const fr = fitRect($("#v-stage")); const r = frame.getBoundingClientRect(); const s = r.width / fr.size;
  V.classList.add("closing"); vEl.classList.remove("swap"); vEl.classList.add("anim"); vEl.style.transform = `translate(${r.left - fr.left}px, ${r.top - fr.top}px) scale(${s})`; vEl.style.borderRadius = 14 / s + "px";
  setTimeout(finish, 320);
}
let swipe = null;
$("#v-stage").addEventListener("pointerdown", (e) => { if (e.target.closest(".nav")) return; swipe = { x: e.clientX, y: e.clientY }; });
$("#v-stage").addEventListener("pointerup", (e) => { if (!swipe) return; const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y; swipe = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) stepViewer(dx < 0 ? 1 : -1); else if (dy > 80) closeViewer(); else if (Math.hypot(dx, dy) < 6 && e.target === $("#v-stage")) closeViewer(); });

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target; const a = t.closest("[data-act]");
  if (!t.closest(".menu") && !(a && ["count", "img-opts", "details", "img-menu"].includes(a.dataset.act))) closeMenus();
  if (!a) { const fr = t.closest(".frame[data-s='complete']"); if (fr && !t.closest(".tools")) openViewer(fr.dataset.id); return; }
  const act = a.dataset.act;
  const H = {
    drawer: () => { $("#drawer").hidden = false; $("#scrim-d").hidden = false; renderSidebar(); },
    "drawer-close": () => { $("#drawer").hidden = true; $("#scrim-d").hidden = true; },
    theme: () => { document.documentElement.dataset.theme = a.dataset.v; store.set("theme", a.dataset.v); renderSidebar(); },
    words: () => { playful = a.dataset.v === "1"; store.set("playful", playful); renderSidebar(); toast(playful ? "Status words: Playful" : "Status words: Plain (always “Working”)"); },
    motion: () => { document.documentElement.dataset.motion = a.dataset.v; store.set("motion", a.dataset.v); renderSidebar(); },
    gallery: () => toast("Images opens the Gallery: every image, with a link back to its chat."),
    search: () => { search = !search; a.setAttribute("aria-pressed", search); },
    think: () => { think = !think; a.setAttribute("aria-pressed", think); },
    "image-on": () => setImageMode(true), "image-off": () => setImageMode(false),
    "ref-off": () => { refine = null; renderRef(); input.focus(); },
    count: () => { const m = openMenu(a, `<div class="h">IMAGES</div>${[1, 2, 3].map((n) => `<button role="menuitemradio" aria-checked="${n === count}" data-n="${n}">${n} image${n > 1 ? "s" : ""}</button>`).join("")}`); $$("[data-n]", m).forEach((b) => b.addEventListener("click", () => { count = +b.dataset.n; updateSend(); closeMenus(); input.focus(); })); },
    "img-opts": () => { const m = openMenu(a, `<div class="h">SEED</div><button role="menuitemradio" aria-checked="${seedMode === "auto"}" data-s="auto">Automatic</button><button role="menuitemradio" aria-checked="${seedMode === "fixed"}" data-s="fixed">Use a fixed seed</button>`); $$("[data-s]", m).forEach((b) => b.addEventListener("click", () => { seedMode = b.dataset.s; closeMenus(); toast(seedMode === "auto" ? "Seeds: automatic" : "Seed: 18342 (editable in the app)"); })); },
    "toggle-thought": () => { const open = a.getAttribute("aria-expanded") !== "true"; a.setAttribute("aria-expanded", open); a.nextElementSibling.hidden = !open; },
    save: () => toast("Save opens the existing save and share dialog (PNG or JSON)."),
    copy: () => { const img = imgFromEvent(t); try { navigator.clipboard.writeText(img.prompt).catch(() => {}); } catch {} toast("Prompt copied"); },
    "copy-turn": () => { const turn = a.closest(".a-row")._turn; try { navigator.clipboard.writeText(turn.prompt).catch(() => {}); } catch {} toast("Prompt copied"); },
    more: () => { const img = imgFromEvent(t); closeViewer(); seedMode = "auto"; imageTurn(img.prompt, 1, img.id); },
    refine: () => { const img = imgFromEvent(t); closeViewer(); refine = img; setImageMode(true, { prompt: img.prompt, force: true }); renderRef(); },
    details: () => { const img = imgFromEvent(t); const secs = img.t1 ? Math.round((img.t1 - img.t0) / 1000) : "—"; openMenu(a, `<strong>Details</strong><dl><dt>Prompt</dt><dd>${esc(img.prompt)}</dd><dt>Seed</dt><dd>${img.seed}</dd><dt>Model</dt><dd>FLUX.2 klein 4B</dd><dt>Size</dt><dd>1024 × 1024 · 4 steps</dd><dt>Time</dt><dd>${secs} s</dd><dt>File</dt><dd>1.3 MB PNG</dd>${img.parent ? "<dt>From</dt><dd>An earlier image in this chat</dd>" : ""}</dl>`, "details"); },
    "img-menu": () => { const m = openMenu(a, `<button data-x="ask">${ico("message")}Ask about it</button><button data-x="rm" class="danger">${ico("trash")}Remove</button>`); $$("[data-x]", m).forEach((b) => b.addEventListener("click", () => { closeMenus(); toast(b.dataset.x === "ask" ? "Attaches the image for a vision model (offered only when the model can see images)." : "Remove asks first, then the frame shows “Image removed”."); })); },
    "try-again": () => { const turn = a.closest(".a-row")._turn; seedMode = "auto"; addVersion(turn, turn.versions[turn.v].length); },
    "cancel-turn": () => { const turn = a.closest(".a-row")._turn; turn.versions[turn.v].forEach((id) => { const img = images.get(id); if (["queued", "preparing", "running"].includes(img.state)) { img.state = "cancelled"; img.decoding = false; updateFrame(img); } }); updateTurnStatus(turn); toast("Cancelled. Finished images are kept."); },
    "retry-img": () => { const img = imgFromEvent(t); img.state = "queued"; img.step = 0; img.t0 = Date.now(); queue.push(img.id); updateFrame(img); updateTurnStatus(img.turn); pump(); },
    "v-back": () => { const turn = a.closest(".a-row")._turn; turn.v = Math.max(0, turn.v - 1); renderTurn(turn); },
    "v-fwd": () => { const turn = a.closest(".a-row")._turn; turn.v = Math.min(turn.versions.length - 1, turn.v + 1); renderTurn(turn); },
    "viewer-close": closeViewer, "v-prev": () => stepViewer(-1), "v-next": () => stepViewer(1),
    "v-save": () => toast("Save opens the existing save and share dialog."),
    "v-more": () => { const img = viewerImg(); closeViewer(); setTimeout(() => imageTurn(img.prompt, 1, img.id), reduced() ? 0 : 330); },
    "v-refine": () => { const img = viewerImg(); closeViewer(); refine = img; setTimeout(() => { setImageMode(true, { prompt: img.prompt, force: true }); renderRef(); }, reduced() ? 0 : 330); },
    "v-copy": () => { const img = viewerImg(); try { navigator.clipboard.writeText(img.prompt).catch(() => {}); } catch {} toast("Prompt copied"); },
  };
  (H[act] || (() => {}))();
});
document.addEventListener("keydown", (e) => {
  if (!$("#viewer").hidden) { if (e.key === "Escape") closeViewer(); if (e.key === "ArrowRight") stepViewer(1); if (e.key === "ArrowLeft") stepViewer(-1); return; }
  if (e.key === "Escape") closeMenus();
  const fr = document.activeElement && document.activeElement.closest && document.activeElement.closest(".frame[data-s='complete']"); if (fr && e.key === "Enter") openViewer(fr.dataset.id);
  if (e.key === "Enter" && e.target.closest && e.target.closest("[data-act='image-off']")) setImageMode(false);
});
$("#scrim-d").addEventListener("click", () => { $("#drawer").hidden = true; $("#scrim-d").hidden = true; });
addEventListener("resize", () => { if (!$("#viewer").hidden) showViewer(false); });

/* ---------- Boot ---------- */
const th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th;
const mo = store.get("motion", ""); if (mo) document.documentElement.dataset.motion = mo;
renderSidebar(); seed(); input.value = chatDraft; autosize(); updateSend(); scrollDown(true);
})();
</script>
