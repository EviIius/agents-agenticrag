<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Workflow Studio reference prototype. Fake data only. See WORKFLOW-STUDIO-SPEC.md; where they differ, the spec wins. -->
<title>Workflow Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Layout: Atelier shell (sidebar | content). Studio = top bar over Blocks | canvas | right panel.
   Tokens are copied from web/src/styles/globals.css; category tokens are the new ones in SPEC §7.1. */
:root {
  --bg: #faf9f6; --bg-sidebar: #f2f1ec; --surface: #ffffff; --surface-2: #f0efea; --surface-3: #e8e6e0;
  --line: #e4e2dc; --line-strong: #d2cfc7; --line-input: #8e8a82;
  --text: #1d1c1a; --text-2: #57544e; --text-3: #6a665f;
  --brand: #2f5bea; --brand-hover: #2448c4; --brand-soft: #e8eefe; --on-brand: #ffffff;
  --success: #1d7a4b; --warning: #8a5a00; --danger: #b42318;
  --overlay: rgb(29 28 26 / 0.32);
  --shadow-sm: 0 1px 2px rgb(20 20 18 / 0.05);
  --shadow-md: 0 1px 3px rgb(20 20 18 / 0.06), 0 6px 20px rgb(20 20 18 / 0.08);
  --shadow-lg: 0 2px 6px rgb(20 20 18 / 0.06), 0 16px 48px rgb(20 20 18 / 0.14);
  --cat-input: #57544e; --cat-input-tint: #f0efea;
  --cat-ai: #2f5bea; --cat-ai-tint: #e8eefe;
  --cat-knowledge: #0f766e; --cat-knowledge-tint: #dff2ee;
  --cat-media: #7c3aed; --cat-media-tint: #f1ebfe;
  --cat-logic: #8a5a00; --cat-logic-tint: #fbf0dc;
  --cat-review: #be123c; --cat-review-tint: #fde8ec;
  --cat-output: #1d7a4b; --cat-output-tint: #e3f3ea;
  --note-amber: #fbf0dc;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-reading: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-code: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 22px;
  --dur-instant: 80ms; --dur-fast: 120ms; --dur-med: 200ms; --dur-slow: 320ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1); --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-pop: cubic-bezier(0.34, 1.4, 0.64, 1);
  --sidebar-w: 272px; --rail-w: 56px; --topbar-h: 52px; --panel-w: 360px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1b1a; --bg-sidebar: #151514; --surface: #232322; --surface-2: #2b2b29; --surface-3: #34332f;
  --line: #33322f; --line-strong: #45433f; --line-input: #7a766e;
  --text: #eceae5; --text-2: #b4b0a8; --text-3: #9c978e;
  --brand: #7c9dff; --brand-hover: #93aeff; --brand-soft: #24304f; --on-brand: #0d1430;
  --success: #5fd394; --warning: #f2b455; --danger: #ff8a7a;
  --overlay: rgb(0 0 0 / 0.55);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
  --shadow-md: 0 1px 3px rgb(0 0 0 / 0.35), 0 8px 24px rgb(0 0 0 / 0.35);
  --shadow-lg: 0 2px 6px rgb(0 0 0 / 0.4), 0 20px 56px rgb(0 0 0 / 0.5);
  --cat-input: #b4b0a8; --cat-input-tint: #2b2b29;
  --cat-ai: #7c9dff; --cat-ai-tint: #24304f;
  --cat-knowledge: #5cc8bb; --cat-knowledge-tint: #1b3330;
  --cat-media: #b49bff; --cat-media-tint: #2e2645;
  --cat-logic: #f2b455; --cat-logic-tint: #3a2f1a;
  --cat-review: #ff8fa3; --cat-review-tint: #3d2229;
  --cat-output: #5fd394; --cat-output-tint: #1c3527;
  --note-amber: #3a2f1a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1b1b1a; --bg-sidebar: #151514; --surface: #232322; --surface-2: #2b2b29; --surface-3: #34332f;
  --line: #33322f; --line-strong: #45433f; --line-input: #7a766e;
  --text: #eceae5; --text-2: #b4b0a8; --text-3: #9c978e;
  --brand: #7c9dff; --brand-hover: #93aeff; --brand-soft: #24304f; --on-brand: #0d1430;
  --success: #5fd394; --warning: #f2b455; --danger: #ff8a7a;
  --overlay: rgb(0 0 0 / 0.55);
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
  --shadow-md: 0 1px 3px rgb(0 0 0 / 0.35), 0 8px 24px rgb(0 0 0 / 0.35);
  --shadow-lg: 0 2px 6px rgb(0 0 0 / 0.4), 0 20px 56px rgb(0 0 0 / 0.5);
  --cat-input: #b4b0a8; --cat-input-tint: #2b2b29;
  --cat-ai: #7c9dff; --cat-ai-tint: #24304f;
  --cat-knowledge: #5cc8bb; --cat-knowledge-tint: #1b3330;
  --cat-media: #b49bff; --cat-media-tint: #2e2645;
  --cat-logic: #f2b455; --cat-logic-tint: #3a2f1a;
  --cat-review: #ff8fa3; --cat-review-tint: #3d2229;
  --cat-output: #5fd394; --cat-output-tint: #1c3527;
  --note-amber: #3a2f1a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.meta { font-size: 12px; color: var(--text-3); }
kbd { font: 11px var(--font-code); color: var(--text-3); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100%; transition: grid-template-columns var(--dur-slow) var(--ease-sheet); }
.app[data-rail="true"] { grid-template-columns: var(--rail-w) minmax(0, 1fr); }
.sidebar { background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 8px; min-width: 0; overflow: hidden; border-right: 1px solid transparent; }
.sb-head { display: flex; align-items: center; gap: 4px; height: 44px; }
.sb-name { flex: 1; font-weight: 500; white-space: nowrap; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-sm); color: var(--text-2); transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn[aria-pressed="true"] { color: var(--brand); }
.sb-search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; margin: 4px 0 8px; border-radius: var(--radius-md); background: var(--surface-2); color: var(--text-3); white-space: nowrap; overflow: hidden; }
.sb-search span { flex: 1; }
.nav-row { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: var(--radius-md); border: 0; background: transparent; width: 100%; text-align: left; color: var(--text); white-space: nowrap; position: relative; transition: background-color var(--dur-fast) var(--ease); }
.nav-row:hover { background: var(--surface-2); }
.nav-row[aria-current="page"] { background: var(--surface-3); box-shadow: inset 2px 0 0 var(--brand); }
.nav-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); margin-left: auto; }
.sb-label { font-size: 11px; letter-spacing: .06em; color: var(--text-3); padding: 18px 12px 6px; white-space: nowrap; }
.sb-chats { flex: 1; overflow: auto; min-height: 0; }
.chat-row { display: block; padding: 9px 12px; border-radius: var(--radius-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); font-size: 14px; cursor: pointer; }
.chat-row:hover { background: var(--surface-2); }
.sb-foot { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
.proto-row { display: flex; gap: 4px; align-items: center; padding: 0 4px 6px; }
.proto-row .meta { flex: 1; padding-left: 8px; white-space: nowrap; overflow: hidden; }
.app[data-rail="true"] .sb-name, .app[data-rail="true"] .sb-search span, .app[data-rail="true"] .sb-search kbd,
.app[data-rail="true"] .nav-row .lbl, .app[data-rail="true"] .sb-label, .app[data-rail="true"] .sb-chats,
.app[data-rail="true"] .proto-row .meta, .app[data-rail="true"] .sb-new { display: none; }
.app[data-rail="true"] .sb-search { width: 40px; padding: 0 12px; }
.app[data-rail="true"] .proto-row { flex-direction: column; }
.main { min-width: 0; height: 100%; position: relative; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; }
.screen[hidden] { display: none !important; }
.screen.enter { animation: wf-fade var(--dur-med) var(--ease-out) both; }
.phone-menu { display: none; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; white-space: nowrap; transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease); }
.btn:hover { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: transparent; }
.btn.primary:hover { background: var(--brand-hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger-text { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn .spin { animation: wf-spin 1s linear infinite; }

/* ---------- Chat stub ---------- */
.topbar { height: var(--topbar-h); display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; flex-shrink: 0; }
.model-pick { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; padding: 6px 8px; border-radius: var(--radius-sm); }
.model-pick .live { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--success); }
.chat-empty { flex: 1; display: grid; place-items: center; padding: 16px; }
.chat-empty-inner { width: min(720px, 100%); display: flex; flex-direction: column; align-items: center; gap: 24px; margin-top: -60px; }
.greet { font: 400 32px/1.2 var(--font-reading); }
.composer { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-xl); padding: 14px 14px 10px; box-shadow: var(--shadow-md); }
.composer .ph { color: var(--text-3); padding: 2px 4px 18px; }
.composer-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; border: 0; background: transparent; color: var(--text-2); font-size: 13px; }
.pill:hover { background: var(--surface-2); }
.send { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-3); border: 0; display: grid; place-items: center; color: var(--text-2); }
.chat-note { font-size: 12px; color: var(--text-3); text-align: center; max-width: 520px; }
.chat-note b { color: var(--text-2); font-weight: 500; }

/* ---------- Workflows home ---------- */
.home { flex: 1; overflow: auto; }
.home-inner { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px; padding-inline: 32px; display: flex; flex-direction: column; gap: 36px; }
.home-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.home-head h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.home-head p { margin: 6px 0 0; color: var(--text-2); max-width: 60ch; }
.home-head .grow { flex: 1; min-width: 260px; }
.sec-label { font-size: 11px; letter-spacing: .06em; color: var(--text-3); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
.sec-label a { color: var(--brand); font-size: 13px; letter-spacing: 0; cursor: pointer; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.wf-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 168px; cursor: pointer; text-align: left; transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.wf-card:hover { border-color: var(--line-strong); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.wf-card-top { display: flex; gap: 12px; align-items: center; }
.wf-card h3 { margin: 0; font-size: 15px; font-weight: 500; }
.wf-card p { margin: 0; color: var(--text-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.strip { display: flex; align-items: center; }
.strip .t { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; }
.strip .t svg.i { width: 12px; height: 12px; }
.strip .ln { width: 8px; height: 1px; background: var(--line-strong); }
.wf-card-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex-shrink: 0; }
.sdot.ok { background: var(--success); } .sdot.fail { background: var(--danger); } .sdot.wait { background: var(--warning); }
.wf-card-foot .run-q { margin-left: auto; opacity: 0; transition: opacity var(--dur-fast) var(--ease); height: 30px; padding: 0 10px; }
.wf-card:hover .run-q, .wf-card:focus-within .run-q { opacity: 1; }
@media (hover: none) { .wf-card-foot .run-q { opacity: 1; } }
.tpls { display: flex; flex-wrap: wrap; gap: 8px; }
.tpl { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease); }
.tpl:hover { border-color: var(--line-strong); background: var(--surface-2); }
.tile { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; }
.tpl .tile { width: 26px; height: 26px; border-radius: 999px; }
.tpl .tile svg.i { width: 14px; height: 14px; }
.runs { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.run-row { display: grid; grid-template-columns: 20px minmax(0, 1.2fr) minmax(0, 2fr) auto 16px; gap: 12px; align-items: center; min-height: 56px; padding: 0 16px; border-top: 1px solid var(--line); cursor: pointer; transition: background-color var(--dur-fast) var(--ease); }
.run-row:first-child { border-top: 0; }
.run-row:hover { background: var(--surface-2); }
.run-row .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-row .st { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-row .tm { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.si { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
.si svg.i { width: 11px; height: 11px; stroke-width: 3; }
.si.ok { background: var(--success); color: var(--surface); }
.si.fail { background: var(--danger); color: var(--surface); }
.si.wait { background: var(--warning); color: var(--surface); }

/* category tints */
[data-cat="input"] .tile, .t[data-cat="input"], .tile[data-cat="input"] { background: var(--cat-input-tint); color: var(--cat-input); }
[data-cat="ai"] .tile, .t[data-cat="ai"], .tile[data-cat="ai"] { background: var(--cat-ai-tint); color: var(--cat-ai); }
[data-cat="knowledge"] .tile, .t[data-cat="knowledge"], .tile[data-cat="knowledge"] { background: var(--cat-knowledge-tint); color: var(--cat-knowledge); }
[data-cat="media"] .tile, .t[data-cat="media"], .tile[data-cat="media"] { background: var(--cat-media-tint); color: var(--cat-media); }
[data-cat="logic"] .tile, .t[data-cat="logic"], .tile[data-cat="logic"] { background: var(--cat-logic-tint); color: var(--cat-logic); }
[data-cat="review"] .tile, .t[data-cat="review"], .tile[data-cat="review"] { background: var(--cat-review-tint); color: var(--cat-review); }
[data-cat="output"] .tile, .t[data-cat="output"], .tile[data-cat="output"] { background: var(--cat-output-tint); color: var(--cat-output); }
.tile[data-cat="wf"] { background: var(--surface-2); color: var(--text-2); }

/* ---------- Studio ---------- */
.st-top { height: var(--topbar-h); display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--bg); }
.crumb { display: flex; align-items: center; gap: 4px; min-width: 0; }
.crumb .back { display: inline-flex; align-items: center; gap: 2px; color: var(--text-2); border: 0; background: transparent; height: 32px; padding: 0 6px 0 2px; border-radius: var(--radius-sm); }
.crumb .back:hover { background: var(--surface-2); color: var(--text); }
.crumb .sep { color: var(--text-3); }
.wf-name { font-weight: 500; border: 1px solid transparent; background: transparent; border-radius: var(--radius-sm); padding: 4px 6px; min-width: 60px; max-width: 280px; text-overflow: ellipsis; }
.wf-name:hover { border-color: var(--line); }
.wf-name:focus { border-color: var(--brand); outline: none; background: var(--surface); }
.save-state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); margin-left: 6px; white-space: nowrap; }
.save-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.save-state[data-s="saving"] i { background: var(--brand); animation: wf-breathe 1.5s var(--ease) infinite; }
.st-top .spacer { flex: 1; }
.problems-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--warning); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.problems-chip[data-level="error"] { color: var(--danger); }
.problems-chip:hover { border-color: var(--line-strong); }
.st-body { flex: 1; display: grid; grid-template-columns: 264px minmax(0, 1fr) auto; min-height: 0; }

/* Blocks panel */
.blocks { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.blocks-search { margin: 12px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); color: var(--text-3); }
.blocks-search input { border: 0; outline: none; background: transparent; flex: 1; min-width: 0; color: var(--text); }
.blocks-list { flex: 1; overflow: auto; padding: 0 8px 12px; }
.cat-h { font-size: 11px; letter-spacing: .06em; color: var(--text-3); padding: 12px 8px 6px; }
.blk { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 8px; border-radius: var(--radius-md); border: 0; background: transparent; width: 100%; text-align: left; cursor: grab; transition: background-color var(--dur-fast) var(--ease); }
.blk:hover { background: var(--surface-2); }
.blk:active { cursor: grabbing; }
.blk .tile { width: 28px; height: 28px; border-radius: 7px; }
.blk .tile svg.i { width: 15px; height: 15px; }
.blk .nm { font-size: 13.5px; }
.blk[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.blocks-foot { border-top: 1px solid var(--line); padding: 8px; }

/* Canvas */
.canvas { position: relative; overflow: hidden; min-width: 0; background-color: var(--bg); background-image: radial-gradient(circle, var(--line-strong) 1px, transparent 1.3px); background-size: 16px 16px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: default; }
.canvas.panning { cursor: grabbing; }
.canvas.cam { transition: background-position var(--dur-slow) var(--ease-sheet); }
.viewport { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.viewport.cam { transition: transform var(--dur-slow) var(--ease-sheet); }
.edges { position: absolute; left: -5000px; top: -5000px; width: 10000px; height: 10000px; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--line-strong); stroke-width: 1.5; transition: stroke var(--dur-fast) var(--ease), opacity var(--dur-med) var(--ease); }
.edge-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
.edge-g:hover .edge { stroke: var(--text-3); }
.edge-g.is-sel .edge { stroke: var(--brand); stroke-width: 2; }
.edge.draw { stroke-dasharray: var(--len) var(--len); stroke-dashoffset: 0; animation: wf-draw var(--dur-med) var(--ease-out) both; }
.edge[data-run="active"] { stroke: var(--brand); stroke-width: 2; stroke-dasharray: 6 6; animation: wf-flow 800ms linear infinite; }
.edge[data-run="done"] { stroke: var(--brand); opacity: .55; }
.edge[data-run="off"] { stroke-dasharray: 4 4; opacity: .45; }

.edge-plus path { stroke: var(--text-2); stroke-width: 1.6; stroke-linecap: round; }
.edge-label { font: 500 11px var(--font-ui); fill: var(--text-3); }
.temp-edge { fill: none; stroke: var(--brand); stroke-width: 2; stroke-dasharray: 5 5; }
.running .edge-plus { display: none; }

/* Blocks on the canvas */
.node { position: absolute; width: 288px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), opacity var(--dur-med) var(--ease); cursor: default; }
.node.in { animation: wf-pop 120ms var(--ease-pop) both; }

.node:hover { border-color: var(--line-strong); }

.node.dragging { box-shadow: var(--shadow-lg); z-index: 5; }
.node[data-disabled="true"] { opacity: .5; border-style: dashed; }
.node .body { position: relative; z-index: 1; padding: 12px; border-radius: calc(var(--radius-lg) - 1px); background: var(--surface); }

.node .titles { min-width: 0; flex: 1; }
.node .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .kind { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.node .more { width: 26px; height: 26px; border: 0; background: transparent; border-radius: 6px; color: var(--text-3); display: grid; place-items: center; opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
.node:hover .more, .node.is-sel .more { opacity: 1; }
.node .more:hover { background: var(--surface-2); color: var(--text); }
.node .summary { font-size: 12px; color: var(--text-2); margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 17px; }
.node .summary.warn { color: var(--warning); }
.node .summary.live { color: var(--brand); font-variant-numeric: tabular-nums; }
.node .summary.err { color: var(--danger); }
.node .chips { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.chip { font: 11px var(--font-code); color: var(--text-2); background: var(--surface-2); border-radius: 5px; padding: 1px 6px; }
.port { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); z-index: 3; transform: translate(-50%, -50%); transition: transform var(--dur-instant) var(--ease), border-color var(--dur-instant) var(--ease); }
.port.in { top: 0; left: 50%; }
.port.out { top: 100%; cursor: crosshair; }
.port:hover, .port.hot { transform: translate(-50%, -50%) scale(1.4); border-color: var(--brand); }
.connecting .port.in.ok { border-color: var(--brand); transform: translate(-50%, -50%) scale(1.4); }
.connecting .node.no { opacity: .4; }
.port-lbl { position: absolute; top: calc(100% + 8px); transform: translateX(-50%); font-size: 11px; color: var(--text-3); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; white-space: nowrap; pointer-events: none; z-index: 2; }
.err-dot { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); z-index: 2; }
.err-dot.warn { background: var(--warning); }
.node:hover .err-dot, .node.is-sel .err-dot { display: none; }
.badge { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; z-index: 4; box-shadow: 0 0 0 2px var(--bg); animation: wf-badge var(--dur-med) var(--ease-pop) both; }
.badge svg.i { width: 11px; height: 11px; stroke-width: 3; }
.badge.ok { background: var(--success); color: var(--surface); }
.badge.fail { background: var(--danger); color: var(--surface); }
.badge.wait { background: var(--warning); color: var(--surface); }
.badge.skip { background: var(--surface-3); color: var(--text-2); }
.sweep { display: none; position: absolute; inset: -1px; border-radius: var(--radius-lg); overflow: hidden; z-index: 0; background: var(--brand-soft); }
.sweep::before { content: ""; position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -210px 0 0 -210px; background: conic-gradient(from 0deg, transparent 0 60%, var(--brand) 82%, transparent 100%); animation: wf-sweep 1.6s linear infinite; }
.node[data-run="running"] { border-color: transparent; }
.node[data-run="running"] .sweep { display: block; }
.node[data-run="running"] .body { margin: 1px; }
.node[data-run="waiting"] { opacity: .72; }
.node[data-run="paused"] { border-color: var(--warning); box-shadow: 0 0 0 1px var(--warning); }
.node[data-run="paused"]::after { content: ""; position: absolute; inset: -4px; border-radius: 17px; border: 2px solid var(--warning); animation: wf-breathe 1.5s var(--ease) infinite; pointer-events: none; }
.node[data-run="failed"] { box-shadow: 0 0 0 2px var(--danger); border-color: transparent; }
.node[data-run="skipped"] { opacity: .45; border-style: dashed; }
.node.pulse::after { content: ""; position: absolute; inset: -2px; border-radius: 16px; border: 2px solid var(--brand); animation: wf-pulse var(--dur-med) var(--ease-out) both; pointer-events: none; }
.note { position: absolute; width: 220px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--note-amber); color: var(--text); font-size: 13px; box-shadow: var(--shadow-sm); cursor: default; }
.note .meta { display: block; margin-bottom: 4px; }
.arranging .node, .arranging .note { transition: transform var(--dur-slow) var(--ease-sheet), left var(--dur-slow) var(--ease-sheet), top var(--dur-slow) var(--ease-sheet); }

/* canvas chrome */
.controls { position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; height: 36px; padding: 0 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-sm); z-index: 6; }
.controls .icon-btn { width: 32px; height: 32px; border-radius: 999px; }
.controls .zl { width: 50px; text-align: center; font-size: 12px; color: var(--text-2); border: 0; background: transparent; font-variant-numeric: tabular-nums; height: 32px; border-radius: 999px; }
.controls .zl:hover { background: var(--surface-2); }
.controls .div { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }
.minimap { position: absolute; right: 16px; bottom: 16px; width: 168px; height: 112px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); z-index: 6; overflow: hidden; }
.minimap canvas { width: 100%; height: 100%; display: block; }
.fab { position: absolute; left: 16px; bottom: 64px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--brand); color: var(--on-brand); display: none; place-items: center; box-shadow: var(--shadow-lg); z-index: 6; }
.fab svg.i { width: 22px; height: 22px; }
.canvas-hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow-sm); white-space: nowrap; transition: opacity var(--dur-med) var(--ease); }
.canvas-hint[hidden] { display: none; }
.run-banner { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 10px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px; box-shadow: var(--shadow-md); white-space: nowrap; }
.run-banner .live { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); animation: wf-breathe 1.5s var(--ease) infinite; }

/* Quick add + menus */
.pop { position: absolute; z-index: 30; width: 320px; max-height: 420px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; animation: wf-float var(--dur-fast) var(--ease-out) both; }
.pop-search { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 44px; border-bottom: 1px solid var(--line); color: var(--text-3); }
.pop-search input { flex: 1; border: 0; outline: none; background: transparent; color: var(--text); min-width: 0; }
.pop-list { overflow: auto; padding: 6px; }
.pop-cat { font-size: 11px; letter-spacing: .06em; color: var(--text-3); padding: 8px 8px 4px; }
.pop-item { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: var(--radius-md); cursor: pointer; }
.pop-item[aria-selected="true"] { background: var(--surface-2); }
.pop-item .tile { width: 28px; height: 28px; border-radius: 7px; }
.pop-item .d { font-size: 12px; color: var(--text-3); }
.menu { position: absolute; z-index: 40; min-width: 200px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 4px; animation: wf-float var(--dur-fast) var(--ease-out) both; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 7px 10px; border: 0; background: transparent; border-radius: var(--radius-sm); text-align: left; }
.menu button:hover { background: var(--surface-2); }
.menu button .k { margin-left: auto; font: 11px var(--font-code); color: var(--text-3); }
.menu .sepline { height: 1px; background: var(--line); margin: 4px 0; }
.menu .danger { color: var(--danger); }

/* Right panel */
.right { width: var(--panel-w); border-left: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; min-height: 0; animation: wf-slide var(--dur-med) var(--ease-sheet) both; }
.right[hidden] { display: none; }
.rp-head { display: flex; align-items: center; gap: 10px; padding: 14px 12px 10px 16px; }
.rp-head .titles { flex: 1; min-width: 0; }
.rp-title-in { width: 100%; font-weight: 600; font-size: 15px; border: 1px solid transparent; background: transparent; border-radius: var(--radius-sm); padding: 2px 4px; margin-left: -5px; }
.rp-title-in:hover { border-color: var(--line); }
.rp-title-in:focus { border-color: var(--brand); outline: none; background: var(--surface); }
.rp-tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.rp-tab { border: 0; background: transparent; padding: 10px 2px; margin-right: 14px; color: var(--text-2); font-weight: 500; box-shadow: inset 0 -2px 0 transparent; transition: color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.rp-tab[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--brand); }
.rp-body { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.rp-body > .btn { align-self: flex-start; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field .lab { font-size: 13px; font-weight: 500; }
.field .help { font-size: 12px; color: var(--text-3); }
.inp, .sel { height: 36px; border: 1px solid var(--line-input); border-radius: var(--radius-md); background: var(--surface); padding: 0 10px; min-width: 0; width: 100%; }
.inp:focus, .sel:focus, .vf textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-md); padding: 2px; gap: 2px; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 30px; border-radius: 8px; color: var(--text-2); font-size: 13px; transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sw { width: 36px; height: 22px; border-radius: 999px; background: var(--surface-3); border: 0; position: relative; flex-shrink: 0; transition: background-color var(--dur-fast) var(--ease); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform var(--dur-fast) var(--ease); }
.sw[aria-checked="true"] { background: var(--brand); }
.sw[aria-checked="true"]::after { transform: translateX(14px); }
.vf { position: relative; }
.vf .hl, .vf textarea { font: 13px/1.5 var(--font-ui); padding: 9px 40px 9px 10px; border-radius: var(--radius-md); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; letter-spacing: normal; }
.vf .hl { position: absolute; inset: 0; border: 1px solid transparent; color: var(--text); pointer-events: none; overflow: hidden; }
.vf .hl mark { background: var(--brand-soft); color: var(--brand); border-radius: 4px; box-shadow: 0 0 0 1px var(--brand-soft); }
.vf .hl mark.bad { background: transparent; color: var(--danger); text-decoration: underline wavy var(--danger); box-shadow: none; }
.vf textarea { position: relative; width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line-input); background: transparent; color: transparent; caret-color: var(--text); display: block; }
.vf textarea::selection { background: color-mix(in srgb, var(--brand) 28%, transparent); color: transparent; }
.vf .fieldbg { position: absolute; inset: 0; background: var(--surface); border-radius: var(--radius-md); }
.vx { position: absolute; top: 6px; right: 6px; height: 26px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); font: 500 11px var(--font-code); color: var(--text-2); z-index: 2; }
.vx:hover { border-color: var(--brand); color: var(--brand); }
details.adv summary { cursor: pointer; font-size: 13px; color: var(--text-2); list-style: none; display: flex; align-items: center; gap: 6px; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv[open] summary svg { transform: rotate(90deg); }
details.adv summary svg { transition: transform var(--dur-fast) var(--ease); width: 14px; height: 14px; }
details.adv > div { padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.listbox { display: flex; flex-direction: column; gap: 6px; }
.li { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); font-size: 13px; }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .icon-btn { width: 26px; height: 26px; }
.addlink { border: 0; background: transparent; color: var(--brand); font-weight: 500; font-size: 13px; padding: 4px 0; text-align: left; align-self: flex-start; }
.divider { height: 1px; background: var(--line); margin: 2px 0; }
.sec-h { font-size: 11px; letter-spacing: .06em; color: var(--text-3); }
.empty-out { color: var(--text-3); font-size: 13px; padding: 20px 0; text-align: center; }
.out-text { font: 15px/1.6 var(--font-reading); white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; }
.out-text h4 { font: 600 14px var(--font-ui); margin: 10px 0 4px; }
.out-text h4:first-child { margin-top: 0; }
.out-text ul { margin: 0; padding-left: 18px; }

/* Run panel */
.tl { display: flex; flex-direction: column; }
.tl-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 6px; border-radius: var(--radius-md); cursor: pointer; }
.tl-item:hover { background: var(--surface-2); }
.tl-item .nm { font-weight: 500; }
.tl-item .pg { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-item .pg.live { color: var(--brand); }
.tl-ico { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; border: 1.5px solid var(--line-strong); }
.tl-ico svg.i { width: 11px; height: 11px; stroke-width: 3; }
.tl-ico.ok { background: var(--success); border-color: transparent; color: var(--surface); }
.tl-ico.fail { background: var(--danger); border-color: transparent; color: var(--surface); }
.tl-ico.wait { background: var(--warning); border-color: transparent; color: var(--surface); }
.tl-ico.skip { background: var(--surface-3); border-color: transparent; color: var(--text-2); }
.tl-ico.run { border-color: var(--brand); border-top-color: transparent; animation: wf-spin 1s linear infinite; }
.tl-sub { grid-column: 2 / 4; }
.stream { font: 15px/1.6 var(--font-reading); white-space: pre-wrap; border-left: 2px solid var(--brand-soft); padding: 4px 0 4px 12px; color: var(--text); max-height: 220px; overflow: auto; }
.approve { border: 1px solid var(--warning); border-radius: var(--radius-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.approve p { margin: 0; font-size: 13px; color: var(--text-2); }
.approve textarea { width: 100%; min-height: 160px; border: 1px solid var(--line-input); border-radius: var(--radius-md); padding: 10px; background: var(--bg); resize: vertical; font: 14px/1.55 var(--font-reading); }
.approve .acts { display: flex; gap: 8px; }
.results h3 { margin: 0 0 8px; font-size: 14px; }

/* Outline */
.outline { position: absolute; inset: 0; overflow: auto; padding-block: 20px 120px; padding-inline: 16px; background: var(--bg); z-index: 7; }
.outline[hidden] { display: none; }
.ol { max-width: 560px; margin: 0 auto; }
.ol-row { display: flex; gap: 12px; align-items: center; min-height: 64px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); cursor: pointer; }
.ol-row:hover { border-color: var(--line-strong); }
.ol-row.is-sel { box-shadow: 0 0 0 2px var(--brand); border-color: transparent; }
.ol-row .grow { flex: 1; min-width: 0; }
.ol-row .t1 { font-weight: 500; }
.ol-row .t2 { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-row[data-disabled="true"] { opacity: .55; border-style: dashed; }
.ol-gap { display: flex; flex-direction: column; align-items: center; }
.ol-gap .ln { width: 1px; height: 10px; background: var(--line-strong); }
.ol-add { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text-2); display: grid; place-items: center; }
.ol-add:hover { border-color: var(--brand); color: var(--brand); }
.ol-add svg.i { width: 14px; height: 14px; }
.lane { margin-left: 16px; padding-left: 14px; border-left: 1px dashed var(--line-strong); }
.lane-h { font-size: 11px; letter-spacing: .06em; color: var(--text-3); padding: 10px 0 6px; }

/* Toast + sheet */
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; background: var(--text); color: var(--bg); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; box-shadow: var(--shadow-lg); animation: wf-rise var(--dur-med) var(--ease-out) both; max-width: calc(100vw - 32px); }
.toast button { border: 0; background: transparent; color: inherit; font-weight: 600; text-decoration: underline; padding: 0; }
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 45; animation: wf-fade var(--dur-med) var(--ease) both; }
.scrim[hidden] { display: none; }
.drawer { position: fixed; z-index: 50; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); padding: 8px; background: var(--bg-sidebar); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: wf-drawer var(--dur-slow) var(--ease-sheet) both; }
.drawer[hidden] { display: none; }

@keyframes wf-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes wf-rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes wf-pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@keyframes wf-out { to { opacity: 0; transform: scale(0.96); } }
@keyframes wf-float { from { opacity: 0; transform: translateY(-4px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes wf-slide { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes wf-drawer { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes wf-sheet { from { transform: translateY(100%); } to { transform: none; } }
@keyframes wf-sweep { to { transform: rotate(1turn); } }
@keyframes wf-flow { to { stroke-dashoffset: -12; } }
@keyframes wf-draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes wf-spin { to { transform: rotate(360deg); } }
@keyframes wf-breathe { 50% { opacity: 0.45; } }
@keyframes wf-badge { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes wf-pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.06); opacity: 0; } }

:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
:root[data-motion="reduce"] .node[data-run="running"] .sweep, .reduced-static .node[data-run="running"] .sweep { background: var(--brand); }

    html += `<div class="tl-item" data-tl="${n.id}"><span class="tl-ico ${icoCls[0]}">${icoCls[1] ? ico(icoCls[1]) : ""}</span><div><div class="nm">${esc(n.title)}</div>${s.state === "complete" || s.state === "skipped" ? `<div class="meta">${esc(s.state === "skipped" ? (n.disabled ? "Skipped · disabled" : "Skipped · path not taken") : s.done || "")}</div>` : ""}</div><span class="pg ${s.state === "running" ? "live" : ""}" data-pg="${n.id}">${s.state === "running" ? esc(s.progress || "") : right}</span>`;
    if (s.state === "running" && n.kind === "generate") html += `<div class="tl-sub"><div class="stream" data-stream="${n.id}">${md(s.text || "")}</div></div>`;
    if (s.state === "paused") html += `<div class="tl-sub"><div class="approve"><p>${esc(n.config.message || "Check before the workflow continues.")}</p><textarea id="approve-text" aria-label="Text to approve">${esc(s.draft)}</textarea><div class="acts"><button class="btn primary" data-act="approve">${ico("check")}Approve</button><button class="btn ghost" data-act="reject">Reject</button></div></div></div>`;
    html += `</div>`;
  });
  html += `</div>`;
  if (run.state === "complete") {
    html += `<div class="divider"></div><div class="results"><h3>Results</h3><div class="field"><span class="sec-h">MEETING PACK · DRAFT FOR REVIEW</span><div class="out-text">${md(run.nodes.n_pack ? run.nodes.n_pack.text : "")}</div></div>${run.nodes.n_ok && run.nodes.n_ok.text ? `<div class="field"><span class="sec-h">FOLLOW-UP EMAIL</span><div class="out-text">${esc(run.nodes.n_ok.text)}</div></div>` : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Export</button><button class="btn ghost" data-act="export">View original transcript</button></div></div>`;
  }
  html += `</div>`; R.innerHTML = html;
  const sv = R.querySelector(".stream"); if (sv) sv.scrollTop = sv.scrollHeight;
}

/* ---------- Outline (phone editor + accessible view) ---------- */
function laneOf(n) {
  // The branch lane a block sits in: reachable from exactly one connected port of a block with two or more connected ports.
  for (const b of doc.nodes) {
    if (b.id === n.id) continue;
    const ports = K[b.kind].ports.filter((p) => outE(b.id).some((e) => e.sp === p));
    if (ports.length < 2) continue;
    const hits = ports.filter((p) => outE(b.id).filter((e) => e.sp === p).some((e) => e.t === n.id || reaches(e.t, n.id)));
    if (hits.length === 1) { const i = K[b.kind].ports.indexOf(hits[0]); const lbl = K[b.kind].portLabels(b.config)[i]; return { b, label: b.kind === "condition" ? "If " + lbl.toLowerCase() : lbl }; }
  }
  return null;
}
function renderOutline() {
  const O = $("#outline"); O.hidden = mode !== "outline"; if (mode !== "outline") return;
  const order = topo(); let html = `<div class="ol">`; let curLane = null;
  const row = (n) => { const k = K[n.kind]; const rs = run && run.nodes[n.id]; let sum = k.sum(n.config); if (Array.isArray(sum)) sum = sum[0]; if (n.disabled) sum = "Disabled"; if (rs && rs.state === "running") sum = rs.progress; if (rs && rs.state === "complete") sum = rs.done || "Done"; if (rs && rs.state === "paused") sum = "Waiting for you"; if (rs && rs.state === "skipped") sum = "Skipped";
    const st = rs ? ({ complete: `<span class="si ok">${ico("check")}</span>`, paused: `<span class="si wait">${ico("pause")}</span>`, running: `<span class="tl-ico run"></span>`, skipped: `<span class="meta">—</span>` }[rs.state] || "") : ico("chev-r");
    return `<div class="ol-row ${sel.node === n.id ? "is-sel" : ""}" data-ol="${n.id}" data-cat="${k.cat}" data-disabled="${!!n.disabled}"><span class="tile">${ico(k.icon)}</span><div class="grow"><div class="t1">${esc(n.title)}</div><div class="t2">${esc(sum)}</div></div>${st}</div>`; };
  order.forEach((n, i) => {
    const lane = laneOf(n); const key = lane ? lane.b.id + lane.label : null; let header = false;
    if (key !== curLane) { if (curLane) html += `</div>`; if (key) { html += `<div class="lane"><div class="lane-h">${esc(lane.label.toUpperCase())}</div>`; header = true; } else if (curLane) { html += `<div class="lane-h" style="padding-left:2px">THEN</div>`; header = true; } curLane = key; }
    if (i > 0 && !header) html += `<div class="ol-gap"><span class="ln"></span>${!run ? `<button class="ol-add" data-oladd="${n.id}" aria-label="Add a block before ${esc(n.title)}">${ico("plus")}</button><span class="ln"></span>` : ""}</div>`;
    html += row(n);
  });
  if (curLane) html += `</div>`;
  html += `</div>`; O.innerHTML = html;
}

/* ---------- Toasts, drawer ---------- */
function toast(msg, action, fn) { if (!msg) return; const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action)}</button>` : ""}`; if (action) t.querySelector("button").onclick = () => { fn(); t.remove(); }; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 4200); }
function openDrawer() { $("#drawer").hidden = false; $("#scrim").hidden = false; $("#drawer").innerHTML = sidebarHTML(true); }
function closeDrawer() { $("#drawer").hidden = true; $("#scrim").hidden = true; }

/* ---------- Events ---------- */
document.addEventListener("click", (ev) => {
  const t = ev.target;
  const goEl = t.closest("[data-go]"); if (goEl) { go(goEl.dataset.go); return; }
  const open = t.closest("[data-open]"); if (open) { go("studio"); if (open.dataset.run) setTimeout(startRun, 60); return; }
  const tpl = t.closest("[data-tpl]"); if (tpl) { go("studio"); toast("Created from template. Changes are yours."); return; }
  const tab = t.closest("[data-tab]"); if (tab) { inspTab = tab.dataset.tab; renderRight(); return; }
  const sg = t.closest("[data-seg]"); if (sg && sel.node) { const n = nodeById(sel.node); commit(); const v = sg.dataset.v; n.config[sg.dataset.seg] = isNaN(+v) ? v : +v; changed(); return; }
  const tg = t.closest("[data-tg]"); if (tg && sel.node) { const n = nodeById(sel.node); commit(); n.config[tg.dataset.tg] = !n.config[tg.dataset.tg]; changed(); return; }
  const vx = t.closest("[data-vx]"); if (vx) { openVarPicker(vx); return; }
  const rm = t.closest("[data-rmedge]"); if (rm) { commit(); doc.edges = doc.edges.filter((e) => e.id !== rm.dataset.rmedge); changed(); return; }
  const rf = t.closest("[data-rmfield]"); if (rf) { const n = nodeById(sel.node); commit(); n.config.fields.splice(+rf.dataset.rmfield, 1); changed(); return; }
  const iss = t.closest("[data-issue]"); if (iss) { const i = $("#right")._issues[+iss.dataset.issue]; if (i && i.node) { sel = { node: i.node, edge: null }; rightMode = "inspector"; inspTab = "setup"; renderAll(); centerOn(i.node, true); } return; }
  const tl = t.closest("[data-tl]"); if (tl && !t.closest("button, textarea, input, .approve")) { sel = { node: tl.dataset.tl, edge: null }; renderAll(); centerOn(tl.dataset.tl, true); return; }
  const ol = t.closest("[data-ol]"); if (ol) { sel = { node: ol.dataset.ol, edge: null }; if (!run) { rightMode = "inspector"; inspTab = "setup"; } renderAll(); return; }
  const oladd = t.closest("[data-oladd]"); if (oladd) { const e = inE(oladd.dataset.oladd)[0]; if (e) { const r = oladd.getBoundingClientRect(); openQuickAdd([r.left + r.width / 2, r.bottom], (k) => insertOnEdge(e.id, k)); } return; }
  const mr = t.closest("[data-menu-r]"); if (mr) { const r = mr.getBoundingClientRect(); openNodeMenu(mr.dataset.menuR, r.left - 160, r.bottom + 4); return; }
  const blk = t.closest(".blk[data-kind]"); if (blk && blk.getAttribute("aria-disabled") !== "true") { addFromPalette(blk.dataset.kind); return; }
  const a = t.closest("[data-act]"); if (!a) { if (!t.closest(".pop, .menu, #canvas") && performance.now() - popOpenedAt > 400) closePops(); return; }
  const act = a.dataset.act;
  const cv = $("#canvas");
  ({
    rail: () => { const app = $("#app"); app.dataset.rail = app.dataset.rail === "true" ? "false" : "true"; setTimeout(() => applyView(), 340); },
    drawer: openDrawer, "close-drawer": closeDrawer,
    images: () => toast("Images opens the existing gallery, now inside the shell."),
    theme: () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; store.set("theme", r.dataset.theme); drawMinimap(); },
    motion: () => { const r = document.documentElement; r.dataset.motion = r.dataset.motion === "reduce" ? "" : "reduce"; store.set("motion", r.dataset.motion); renderSidebar(); toast(r.dataset.motion ? "Reduced motion on: no loops, no movement." : "Motion on."); },
    "new-wf": () => { const r = a.getBoundingClientRect(); openMenu(r.left, r.bottom + 6, [{ label: "Blank", icon: "plus", run: () => { go("studio"); toast("Blank workflows start with Start and Save results."); } }, "-", ...["Brief to images", "Recording to meeting pack", "Research a question", "Ask my files", "Summarize a document"].map((x) => ({ label: x, run: () => { go("studio"); toast("Created from template. Changes are yours."); } }))]); },
    "all-runs": () => toast("All runs: a paged list, filterable by workflow and state."),
    undo, redo,
    more: () => { const r = a.getBoundingClientRect(); openMenu(r.right - 220, r.bottom + 6, [
      { label: mode === "outline" ? "Canvas view" : "Outline view", icon: mode === "outline" ? "workflow" : "list", run: () => { mode = mode === "outline" ? "canvas" : "outline"; renderAll(); } },
      { label: "Workflow settings", icon: "settings", run: () => toast("Workflow settings: name, icon, default text model, test-run retention.") },
      { label: "Versions", icon: "rerun", run: () => toast("Versions: one snapshot per run, restore or name one.") }, "-",
      { label: "View JSON", icon: "file", run: () => toast("View JSON shows the atelier.workflow/1 document.") },
      { label: "Duplicate workflow", icon: "copy", run: () => toast("Duplicated.") }]); },
    run: startRun, "begin-run": beginRun, "show-run": () => { rightMode = "run"; renderAll(); }, "cancel-run": cancelRun, "close-run": closeRun,
    approve: () => { if (!run) return; run.decision = "approve"; run.edited = $("#approve-text").value; const r = run.resume; run.resume = null; if (r) r(); },
    reject: () => { if (!run) return; run.decision = "reject"; run.edited = null; const r = run.resume; run.resume = null; if (r) r(); },
    export: () => toast("Export opens the existing cancellable save dialog (Markdown or JSON)."),
    problems: () => { rightMode = rightMode === "problems" ? (sel.node ? "inspector" : null) : "problems"; renderAll(); },
    "close-right": () => { rightMode = null; if (!run) sel.node = null; renderAll(); },
    "zoom-in": () => { zoomAt(1.2, cv.clientWidth / 2, cv.clientHeight / 2, true); lastUserPan = Date.now(); },
    "zoom-out": () => { zoomAt(1 / 1.2, cv.clientWidth / 2, cv.clientHeight / 2, true); lastUserPan = Date.now(); },
    "zoom-100": () => zoomAt(1 / view.z, cv.clientWidth / 2, cv.clientHeight / 2, true),
    fit: () => fitView(true), tidy, outline: () => { mode = mode === "outline" ? "canvas" : "outline"; renderAll(); },
    follow: () => { follow = !follow; lastUserPan = 0; renderControls(); if (follow && run) { const r = Object.entries(run.nodes).find(([, s]) => ["running", "paused"].includes(s.state)); if (r) centerOn(r[0], true); } },
    "add-field": () => { const n = nodeById(sel.node); commit(); n.config.fields.push({ name: "input_" + (n.config.fields.length + 1), label: "New input", type: "Short text" }); changed(); },
    "add-note": () => { if (run) return; commit(); const [fx, fy] = toFlow(cv.getBoundingClientRect().left + cv.clientWidth / 2, cv.getBoundingClientRect().top + 80); doc.notes.push({ id: "note" + uid++, x: snap16(fx - 110), y: snap16(fy), text: "New note. Notes explain the workflow; they never run." }); changed(); },
    preview: () => { const n = nodeById(sel.node); toast("Preview prompt shows the exact system and user messages, filled with the last run's values."); },
  }[act] || (() => {}))();
});
document.addEventListener("input", (ev) => {
  const t = ev.target; if (!sel.node) return; const n = nodeById(sel.node); if (!n) return;
  const burst = () => { if (!t._committed) { commit(); t._committed = true; } clearTimeout(t._tm); t._tm = setTimeout(() => { t._committed = false; }, 500); };
  if (t.id === "f-title") { burst(); n.title = t.value; changed(false, { skipRight: true }); return; }
  if (t.dataset.f) { burst(); let v = t.value; if (t.dataset.f === "model" && v === "__def") v = MODELS[0]; n.config[t.dataset.f] = v; const vf = t.closest(".vf"); if (vf) syncVF(vf); changed(false, { skipRight: true }); }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.key && sel.node) { const n = nodeById(sel.node); const nk = uniqueKey(t.value); if (nk !== n.key) { commit(); const old = n.key; doc.nodes.forEach((m) => { const c = m.config; for (const k in c) { if (typeof c[k] === "string") c[k] = c[k].replaceAll("{{" + old + ".", "{{" + nk + "."); if (Array.isArray(c[k])) c[k] = c[k].map((x) => typeof x === "string" ? x.replaceAll("{{" + old + ".", "{{" + nk + ".") : x); } }); n.key = nk; changed(); } }
  if (t.dataset.addin && t.value) { commit(); const src = nodeById(t.value); const err = connect(src.id, K[src.kind].ports[0], t.dataset.addin); if (err) { undoStack.pop(); toast(err); } changed(); }
});
document.addEventListener("scroll", (ev) => { const ta = ev.target; if (ta.tagName === "TEXTAREA" && ta.closest(".vf")) ta.closest(".vf").querySelector(".hl").scrollTop = ta.scrollTop; }, true);
document.addEventListener("keydown", (ev) => {
  if (screen !== "studio") return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key === "Enter") { ev.preventDefault(); if (!run) startRun(); return; }
  if (typing) { if (ev.key === "Escape") document.activeElement.blur(); return; }
  if (mod && ev.key.toLowerCase() === "z") { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && ev.key.toLowerCase() === "d" && sel.node) { ev.preventDefault(); duplicateNode(sel.node); return; }
  if ((ev.key === "Delete" || ev.key === "Backspace") && !run) { if (sel.node) { ev.preventDefault(); deleteNode(sel.node); } else if (sel.edge) { ev.preventDefault(); commit(); doc.edges = doc.edges.filter((e) => e.id !== sel.edge); sel.edge = null; changed(); } return; }
  if (ev.key === "Escape") { closePops(); sel = { node: null, edge: null }; if (rightMode === "inspector") rightMode = null; renderAll(); return; }
  if ((ev.key === "n" || ev.key === "/") && !run) { ev.preventDefault(); const cv = $("#canvas").getBoundingClientRect(); openQuickAdd([cv.left + cv.width / 2, cv.top + 80], (k) => addFromPalette(k)); return; }
  if (ev.key === "f" || ev.key === "F") { fitView(true); return; }
  if (sel.node && (ev.key === "ArrowDown" || ev.key === "ArrowUp")) { ev.preventDefault(); const next = ev.key === "ArrowDown" ? outE(sel.node)[0] && outE(sel.node)[0].t : inE(sel.node)[0] && inE(sel.node)[0].s; if (next) { selectNode(next); centerOn(next, true); nodeEls.get(next).focus({ preventScroll: true }); } }
});
document.addEventListener("contextmenu", (ev) => {
  if (screen !== "studio" || run) return; const node = ev.target.closest(".node"); const inCanvas = ev.target.closest("#canvas");
  if (node) { ev.preventDefault(); selectNode(node.dataset.id); openNodeMenu(node.dataset.id, ev.clientX, ev.clientY); }
  else if (inCanvas) { ev.preventDefault(); const [fx, fy] = toFlow(ev.clientX, ev.clientY); openMenu(ev.clientX, ev.clientY, [{ label: "Add block", icon: "plus", k: "N", run: () => openQuickAdd([ev.clientX, ev.clientY], (k) => { commit(); const n = addNode(k, fx - NODE_W / 2, fy); sel = { node: n.id, edge: null }; rightMode = "inspector"; changed(); }) }, { label: "Add note", icon: "note", run: () => { commit(); doc.notes.push({ id: "note" + uid++, x: snap16(fx), y: snap16(fy), text: "New note." }); changed(); } }, "-", { label: "Tidy up", icon: "tidy", run: tidy }, { label: "Fit view", icon: "fit", k: "F", run: () => fitView(true) }]); }
});
$("#scrim").addEventListener("click", closeDrawer);
const cv = $("#canvas");
cv.addEventListener("pointerdown", onPointerDown);
cv.addEventListener("pointermove", onPointerMove);
cv.addEventListener("pointerup", onPointerUp);
cv.addEventListener("pointercancel", onPointerUp);
cv.addEventListener("wheel", onWheel, { passive: false });
cv.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
cv.addEventListener("drop", onDrop);
$("#blocks").addEventListener("dragstart", onDragStart);
cv.addEventListener("dblclick", (ev) => { const nodeEl = ev.target.closest(".node"); if (nodeEl && !run) { selectNode(nodeEl.dataset.id); inspTab = "setup"; renderRight(); setTimeout(() => { const f = $("#f-title"); if (f) { f.focus(); f.select(); } }, 0); } });
$("#fab").addEventListener("click", () => { const r = $("#fab").getBoundingClientRect(); openQuickAdd([r.right + 140, r.top - 380], (k) => addFromPalette(k)); });
addEventListener("resize", () => { if (screen === "studio") { applyView(); if (innerWidth < 768 && mode === "canvas" && !resize.forced) { mode = "outline"; resize.forced = true; renderAll(); } } });
function resize() {}

/* ---------- Boot ---------- */
const th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th;
const mo = store.get("motion", ""); if (mo) document.documentElement.dataset.motion = mo;
if (innerWidth < 768) { mode = "outline"; resize.forced = true; }
go("studio");
setTimeout(() => { if (!$("#hint").hidden) $("#hint").style.opacity = "1"; }, 400);
})();
</script>
