/* Layout: Atelier shell (sidebar | chat). Composer pinned at the bottom with the attachment tray inside it.

:root {
  --bg: #faf9f6; --bg-sidebar: #f2f1ec; --surface: #ffffff; --surface-2: #f0efea; --surface-3: #e8e6e0; --user-bubble: #efede7;

  --overlay: rgb(29 28 26 / 0.32); --scrim: rgb(250 249 246 / 0.72); --viewer-bg: rgb(20 20 18 / 0.92);
  --t-pdf: #be123c; --t-pdf-bg: #fde8ec; --t-word: #2f5bea; --t-word-bg: #e8eefe; --t-text: #57544e; --t-text-bg: #e8e6e0;
  --t-data: #0f766e; --t-data-bg: #dff2ee; --t-audio: #7c3aed; --t-audio-bg: #f1ebfe; --t-bad: #b42318; --t-bad-bg: #fde8ec;
  --shadow-sm: 0 1px 2px rgb(20 20 18 / 0.05); --shadow-md: 0 1px 3px rgb(20 20 18 / 0.06), 0 6px 20px rgb(20 20 18 / 0.08);
  --shadow-lg: 0 2px 6px rgb(20 20 18 / 0.06), 0 16px 48px rgb(20 20 18 / 0.14);
  --shadow-composer: 0 1px 2px rgb(20 20 18 / 0.04), 0 4px 24px -6px rgb(20 20 18 / 0.1);
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-reading: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-code: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 22px;
  --dur-fast: 120ms; --dur-med: 200ms; --dur-slow: 320ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-in: cubic-bezier(0.4, 0, 1, 1);

}

* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.meta { font-size: 12px; color: var(--text-3); }

/* Shell */

.sidebar { background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 8px; min-width: 0; overflow: hidden; }

.icon-btn:hover { background: var(--surface-2); color: var(--text); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; font-size: 13px; }
.btn:hover { background: var(--surface-2); }
.main { min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }

.model-pick .live { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--success); flex-shrink: 0; }
.phone-menu { display: none; }

/* Thread */
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.thread { max-width: var(--thread-w); margin: 0 auto; padding-block: 8px 260px; padding-inline: 24px; display: flex; flex-direction: column; gap: 26px; }
.u-row { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.u-row.fresh { animation: rise var(--dur-med) var(--ease-out) both; }
.bubble { max-width: 80%; background: var(--user-bubble); border-radius: 18px; padding: 10px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.a-row { display: flex; flex-direction: column; }

.working { display: flex; align-items: center; gap: 10px; min-height: 32px; color: var(--text-2); }
.mark { width: 18px; height: 18px; color: var(--brand); display: inline-grid; }
.mark svg { width: 18px; height: 18px; overflow: visible; }
.mark .ma, .mark .mb { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.mark .mb { opacity: .22; } .mark .md { fill: currentColor; transform-box: fill-box; transform-origin: center; }
.mark .ma { animation: mark-draw 1.8s var(--ease-out) infinite; } .mark .md { animation: mark-dot 1.8s var(--ease-out) infinite; }

/* Sent attachments */
.m-photos { display: grid; gap: 6px; justify-content: end; }
.m-photos.n1 { grid-template-columns: minmax(0, 240px); }
.m-photos.n2 { grid-template-columns: repeat(2, 160px); }
.m-photos.n3 { grid-template-columns: repeat(3, 112px); }
.m-photo { position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); cursor: zoom-in; padding: 0; display: block; }
.m-photos.n1 .m-photo { max-height: 240px; aspect-ratio: var(--ar, 1); }
.m-photos.n2 .m-photo, .m-photos.n3 .m-photo { aspect-ratio: 1; }
.m-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.m-photo .more { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / .45); color: #fff; font-weight: 500; font-size: 18px; }
.m-files { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 486px; }
.tile.card.sent { width: 240px; height: 60px; padding-right: 14px; animation: none; }
.main.dragging .dock { z-index: 31; }

.composer:focus-within { border-color: var(--line-input); box-shadow: var(--shadow-composer), 0 0 0 4px color-mix(in srgb, var(--line-strong) 35%, transparent); }
.composer.image-mode { border-color: color-mix(in srgb, var(--brand) 40%, var(--line-strong)); }
.composer.drop-target { border-color: var(--brand); }
.tray-wrap { position: relative; margin: 2px 2px 8px; }
.tray { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding-inline: 8px; scrollbar-width: none; padding: 8px 8px 2px; margin: -6px -8px 0; }
.tray::-webkit-scrollbar { display: none; }
.tray-wrap.overflow::after { content: ""; position: absolute; right: -8px; top: 0; bottom: 0; width: 28px; background: linear-gradient(90deg, transparent, var(--surface)); pointer-events: none; }
.count { align-self: center; flex-shrink: 0; font-size: 12px; color: var(--text-3); padding: 0 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tile { position: relative; flex-shrink: 0; scroll-snap-align: start; border-radius: var(--radius-md); border: 1px solid var(--line); animation: tile-in 160ms var(--ease-pop) both; transition: width var(--dur-med) var(--ease-out), margin var(--dur-med) var(--ease-out), opacity var(--dur-fast) var(--ease-in), transform var(--dur-fast) var(--ease-in), border-color var(--dur-fast) var(--ease); }
.tile.leaving { opacity: 0; transform: scale(.92); }
.tile.collapse { width: 0 !important; margin-right: -8px; border-width: 0; padding: 0; overflow: hidden; }
.tile.photo { width: 72px; height: 72px; padding: 0; background: var(--surface-2); overflow: visible; }
.tile.photo .ph { width: 100%; height: 100%; border-radius: calc(var(--radius-md) - 1px); overflow: hidden; display: grid; place-items: center; color: var(--text-3); background: var(--surface-2); border: 0; padding: 0; cursor: zoom-in; }
.tile.photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity var(--dur-med) var(--ease); }
.tile.photo[data-s="uploading"] img, .tile.photo[data-s="preparing"] img { opacity: .6; }
.tile.card { width: 232px; height: 72px; background: var(--surface-2); display: flex; align-items: center; gap: 10px; padding: 0 10px; overflow: hidden; }
.tile.card .open { position: absolute; inset: 0; border: 0; background: transparent; border-radius: inherit; }
.badge { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font: 600 10px var(--font-code); letter-spacing: .04em; flex-shrink: 0; position: relative; pointer-events: none; }
.badge[data-t="pdf"] { background: var(--t-pdf-bg); color: var(--t-pdf); }
.badge[data-t="word"] { background: var(--t-word-bg); color: var(--t-word); }
.badge[data-t="text"] { background: var(--t-text-bg); color: var(--t-text); }
.badge[data-t="data"] { background: var(--t-data-bg); color: var(--t-data); }
.badge[data-t="audio"] { background: var(--t-audio-bg); color: var(--t-audio); }
.badge[data-t="bad"] { background: var(--t-bad-bg); color: var(--t-bad); }
.badge[data-t="photo"] { background: var(--surface-3); color: var(--text-2); }
.card-txt { min-width: 0; pointer-events: none; }
.card-txt .nm { font-size: 13px; font-weight: 500; white-space: nowrap; display: flex; min-width: 0; }
.card-txt .nm .h { overflow: hidden; text-overflow: ellipsis; min-width: 0; white-space: pre; }
.card-txt .nm .t { flex: none; white-space: pre; }
.tile.card .nm { margin-right: 22px; }
.tile.card[data-k="audio"] .mt { margin-right: 22px; }
.tile.card.sent .nm { margin-right: 0; }
.card-txt { flex: 1; }
.card-txt .mt { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; position: relative; }
.card-txt .mt.live { color: var(--text-2); }
.card-txt .mt.live::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--surface-3), transparent); opacity: .35; animation: shimmer 1.6s linear infinite; }
.bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--brand); width: 0; transition: width var(--dur-fast) linear, opacity var(--dur-med) var(--ease); border-radius: 0 2px 2px 0; }
.tile[data-s="ready"] .bar, .tile[data-s="error"] .bar, .tile[data-s="warning"] .bar { opacity: 0; }
.x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgb(20 20 18 / .62); color: #fff; display: grid; place-items: center; padding: 0; z-index: 3; transition: opacity var(--dur-fast) var(--ease); }
@media (hover: hover) and (pointer: fine) { .tile.photo:not(:hover):not(:focus-within) .x { opacity: 0; } }
.x::before { content: ""; position: absolute; inset: -7px; }
.x:hover { background: rgb(20 20 18 / .8); }
.tile.card .x { background: transparent; color: var(--text-3); }
.tile.card .x:hover { background: var(--surface-3); color: var(--text); }
.x svg.i { width: 11px; height: 11px; stroke-width: 2.6; }
.tile.card .x { top: 6px; right: 6px; }
.tile.card .dots { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 6px; border: 0; background: transparent; color: var(--text-3); display: grid; place-items: center; padding: 0; z-index: 2; }
.tile.card .dots:hover { background: var(--surface-3); color: var(--text); }
.ring { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; transition: opacity var(--dur-med) var(--ease), transform var(--dur-med) var(--ease); }

.ring .val { stroke: #fff; stroke-linecap: round; stroke-dasharray: 0 100; transition: stroke-dasharray var(--dur-fast) linear; transform: rotate(-90deg); transform-origin: center; }

.done { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--success); color: var(--surface); display: grid; place-items: center; animation: done 600ms var(--ease-pop) both; pointer-events: none; }
.done svg.i { width: 12px; height: 12px; stroke-width: 3; }
.tile.card .flag { left: 38px; top: 12px; }

.tile.card .done svg.i { width: 9px; height: 9px; }
.tile[data-s="warning"] { border-color: var(--warning); box-shadow: 0 0 0 1px var(--warning); }
.tile[data-s="error"] { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.tile.photo[data-s="error"] img { opacity: .35; }
.flag { position: absolute; left: 4px; top: 4px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--font-ui); color: var(--surface); z-index: 3; animation: pop 160ms var(--ease-pop) both; }
.tile[data-s="warning"] .flag { background: var(--warning); } .tile[data-s="error"] .flag { background: var(--danger); }
.status { display: flex; align-items: center; gap: 8px; margin: -2px 6px 8px; font-size: 12.5px; animation: rise var(--dur-med) var(--ease-out) both; flex-wrap: wrap; }
.status.warning { color: var(--warning); } .status.error { color: var(--danger); } .status.info { color: var(--text-2); }
.status .act { border: 0; background: transparent; padding: 0; color: var(--brand); font-weight: 500; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.composer textarea { width: 100%; border: 0; outline: none; resize: none; background: transparent; min-height: 48px; max-height: 200px; padding: 4px 8px 8px; line-height: 1.5; font-size: 16px; display: block; }
.composer textarea::placeholder { color: var(--text-3); }
.c-row { display: flex; align-items: center; gap: 6px; min-height: 36px; }
.grow { flex: 1; }
.tool-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--text-2); font-size: 13px; transition: background-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.tool-btn:hover, .tool-btn[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
.chips { display: flex; align-items: center; gap: 6px; min-width: 0; }

.chip .cm { display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 4px 0 10px; border: 0; background: transparent; color: inherit; border-radius: 999px 0 0 999px; font-weight: 500; }
.chip .cm .chev { width: 13px; height: 13px; margin-left: -2px; }
.chip .cx { position: relative; width: 24px; height: 24px; margin-right: 4px; border: 0; border-radius: 50%; background: transparent; color: inherit; display: grid; place-items: center; padding: 0; opacity: .8; }

(() => {

  const uploading = pending.filter((t) => t.state === "uploading" || t.state === "preparing");
  ring.classList.toggle("indet", pending.length > 0 && uploading.length === 0);
  if (uploading.length) { const avg = uploading.reduce((a, t) => a + t.pct, 0) / uploading.length; ring.querySelector("circle").style.strokeDasharray = `${avg} 100`; }
  const tokens = tray.reduce((a, t) => a + (t.k === "pdf" ? 8400 : t.k === "word" ? 2100 : t.k === "audio" ? 3900 : t.k === "photo" ? 800 : t.k === "text" ? Math.round(t.size / 4) : 0), 0) + 1800;
  $("#ctx").style.strokeDasharray = `${Math.min(100, (tokens / model.ctx) * 100)} 100`;
  const pw = $("#plus-wrap"); const full = tray.filter((t) => t.state !== "error").length >= 8; pw.classList.toggle("disabled", full); pw.title = full ? "8 files is the limit for one message" : "Attach files · ⌘U";
}
function live(text) { $("#live").textContent = text; }
const NOTE0 = () => $("#note").dataset.base || ($("#note").dataset.base = $("#note").innerHTML);
let noteT = 0;
function note(text, flash = true, ms = 4000) { const n = $("#note"); NOTE0(); n.innerHTML = text || n.dataset.base; n.classList.remove("flash"); if (flash && text) { void n.offsetWidth; n.classList.add("flash"); } clearTimeout(noteT); if (text && ms) noteT = setTimeout(() => { n.innerHTML = n.dataset.base; n.classList.remove("flash"); }, ms); }

/* ---------- Send ---------- */
async function sendMessage() {

  files.forEach((t) => (t.sent = true)); tray = tray.filter((t) => !files.includes(t)); $("#tray-host").innerHTML = ""; renderTray();
  input.value = ""; autosize(); updateAll();
  const row = document.createElement("div"); row.className = "u-row" + (reduced() ? "" : " fresh");
  const photos = files.filter((f) => f.k === "photo"); const docs = files.filter((f) => f.k !== "photo");
  const n = photos.length; const cls = n === 1 ? "n1" : n === 2 ? "n2" : "n3"; const shown = photos.slice(0, 6);
  row.innerHTML = `${n ? `<div class="m-photos ${cls}">${shown.map((p, i) => `<button class="m-photo" data-act="m-open" data-set="${photos.map((x) => x.id).join(",")}" data-i="${i}" aria-label="Open ${esc(p.name)}" ${n === 1 ? `style="--ar:${p.ar || 1}"` : ""}><img alt="" src="${p.url}" loading="lazy" decoding="async">${i === 5 && n > 6 ? `<span class="more">+${n - 6}</span>` : ""}</button>`).join("")}</div>` : ""}
    ${docs.length ? `<div class="m-files">${docs.map((d) => `<div class="tile card sent" data-s="ready"><button type="button" class="open" data-act="m-doc" data-id="${d.id}" aria-label="Open ${esc(d.name)}"></button><span class="badge" data-t="${tint(d)}">${esc(label(d))}</span><span class="card-txt">${nameHTML(d.name)}<div class="mt">${esc(d.meta)}</div></span></div>`).join("")}</div>` : ""}
    ${text ? `<div class="bubble">${esc(text)}</div>` : ""}`;
  sentFiles.push(...files); thread.appendChild(row); scroll();
  photos.forEach((p) => { const im = new Image(); im.onload = () => { p.ar = im.naturalWidth / im.naturalHeight; const b = row.querySelector(`.m-photos.n1 .m-photo`); if (b) b.style.setProperty("--ar", p.ar); }; im.src = p.url; });
  const a = document.createElement("div"); a.className = "a-row"; a.innerHTML = `<div class="a-model">${esc(model.id)}</div><div class="working">${MARK}<span>Mulling…</span></div>`; thread.appendChild(a); scroll();
  await sleep(1600);
  const parts = []; if (photos.length) parts.push(`${photos.length} photo${photos.length > 1 ? "s" : ""}`); docs.forEach((d) => parts.push(d.k === "pdf" ? "a 12-page PDF" : d.k === "word" ? "a Word document" : d.k === "audio" ? "a 12-minute recording" : `${d.name}`));
  const reply = parts.length ? `I have ${parts.join(", ").replace(/, ([^,]*)$/, " and $1")}. Here is a first read: the plan is clear on dates and stalls; the open question is power for the food trucks.` : "Got it. What would you like to do next?";
  a.querySelector(".working").remove(); const ans = document.createElement("div"); ans.className = "answer"; ans.innerHTML = "<p></p>"; a.appendChild(ans);
  for (const w of reply.split(/(\s+)/)) { if (/^\s+$/.test(w)) { ans.firstChild.appendChild(document.createTextNode(w)); continue; } const s = document.createElement("span"); if (!reduced()) s.className = "w"; s.textContent = w; ans.firstChild.appendChild(s); scroll(); await sleep(24); }
  busy = false; updateAll();
}
const sentFiles = [];
function scroll() { const s = $("#scroll"); s.scrollTop = s.scrollHeight; }
function autosize() { input.style.height = "auto"; input.style.height = Math.min(180, input.scrollHeight) + "px"; }

/* ---------- Viewer and sheet ---------- */
let vSet = [], vI = 0;
function openViewer(ids, i) { vSet = ids.map((id) => [...tray, ...sentFiles].find((t) => t.id === id)).filter((t) => t && t.url); if (!vSet.length) return; vI = Math.max(0, Math.min(i, vSet.length - 1)); $("#viewer").hidden = false; showV(); $("#viewer [data-act='v-close']").focus(); }
function showV() { const t = vSet[vI]; const img = $("#v-img"); img.style.animation = "none"; void img.offsetWidth; img.style.animation = ""; img.src = t.url; img.alt = t.name; $("#v-name").textContent = t.name; $("#v-pos").textContent = vSet.length > 1 ? `${vI + 1} / ${vSet.length}` : ""; $$("#viewer .nav").forEach((b) => (b.hidden = vSet.length < 2)); }
function openSheet(t) {

  let body = "";
  if (t.k === "text") body = `<div class="body mono">${esc(t.text ?? (t.name === "Stall-prices.csv" ? "stall,size_m,price\nA1,3,40\nA2,3,40\nB1,6,70" : "Preview appears here."))}</div>`;
  else if (t.k === "pdf" || t.k === "word") body = `<div class="body"><div class="page"><div class="pn">PAGE 1 · EXTRACTED TEXT (FAKE)</div>${PAGE_HTML}</div><div class="page"><div class="pn">PAGE 2</div>Vendor contacts, stall map and set-up schedule continue on the following pages.</div></div>`;
  else if (t.k === "audio") body = `<div class="body"><div class="page"><div class="pn">TRANSCRIPT (FAKE) · 0:00</div>Okay, let's start with the market. The main open item is power for the food trucks; we still need a quote.</div><div class="page"><div class="pn">2:14</div>Posters go to print on Monday. Two hundred copies.</div></div>`;
  S.innerHTML = `<header><span class="badge" data-t="${tint(t)}">${esc(label(t))}</span><span class="t"><b>${esc(t.name)}</b><span class="meta">${esc(t.meta || human(t.size))}</span></span><button class="icon-btn" data-act="sheet-close" aria-label="Close">${ico("x")}</button></header>${body}`;
  $("[data-act='sheet-close']", S).focus();
}
function closeSheet() { $("#sheet").hidden = true; $("#sheet-scrim").hidden = true; }

/* ---------- Menus and toasts ---------- */
function closeMenus() { $$(".menu").forEach((m) => m.remove()); const tb = $("#tools-btn"); if (tb) tb.setAttribute("aria-expanded", "false"); }
function openMenu(anchor, html, cls = "") { closeMenus(); const m = document.createElement("div"); m.className = "menu" + (cls ? " " + cls : ""); m.setAttribute("role", "menu"); m.innerHTML = html; document.body.appendChild(m); const r = anchor.getBoundingClientRect(); const W = m.offsetWidth, H = m.offsetHeight; let top = r.top - H - 6; if (top < 8) top = r.bottom + 6; m.style.left = Math.max(8, Math.min(r.left, innerWidth - W - 8)) + "px"; m.style.top = top + "px"; return m; }
function toast(text) { const t = document.createElement("div"); t.className = "toast"; t.textContent = text; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 2800); }
function setModel(i) { model = MODELS[i]; store.set("model", i); renderSidebar(); tray.forEach((t) => { if (t.k === "photo" && (t.state === "warning" || t.state === "ready")) { if (model.vision) { if (t.state === "warning") { t.state = "ready"; t.reason = ""; t.action = null; t.justDone = true; } } else { t.state = "warning"; t.reason = `${model.id.split(":")[0]} can't see images. Switch to a model that can, or remove the photo.`; t.action = "switch"; } updateTile(t); } }); updateAll(); }

/* ---------- Events ---------- */
$("#file").accept = ACCEPT;
$("#file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
input.addEventListener("input", () => { autosize(); updateAll(); });
input.addEventListener("keydown", (e) => { if (e.key === "Escape" && imageMode && !input.value) { setImage(false); return; } if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); $("#composer").requestSubmit(); } });
input.addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); let n = 1; addFiles(files.map((f) => (f.name && f.name !== "image.png") ? f : new File([f], `Pasted image ${n++}.png`, { type: f.type || "image/png" }))); return; }
  const text = e.clipboardData?.getData("text") || "";
  if (text.length > 4000) { e.preventDefault(); const f = new File([text], `Pasted text ${++pasteN}.txt`, { type: "text/plain" }); f.pasted = text.length; addFiles([f]); const id = tray[tray.length - 1].id; note(`Long paste attached as a file. <button type="button" class="act" data-act="keep-text" data-id="${id}" style="border:0;background:none;color:var(--brand);font-weight:500;text-decoration:underline;padding:0;font-size:12px">Keep as text</button>`, true, 10000); lastPaste = { id, text }; }
});
let lastPaste = null, pasteN = 0;
$("#composer").addEventListener("submit", (e) => { e.preventDefault(); if (imageMode) { toast("Image turns: see the chat images prototype."); return; } if (!$("#send").disabled) sendMessage(); });
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "u") { e.preventDefault(); if (!imageMode) $("#file").click(); }
  if (e.key === "Escape") { if ($(".menu.tools")) $("#tools-btn").focus(); closeMenus(); if (!$("#viewer").hidden) $("#viewer").hidden = true; else if (!$("#sheet").hidden) closeSheet(); }
  if (!$("#viewer").hidden && e.key === "ArrowRight") { vI = (vI + 1) % vSet.length; showV(); }
  if (!$("#viewer").hidden && e.key === "ArrowLeft") { vI = (vI - 1 + vSet.length) % vSet.length; showV(); }
});
let depth = 0; const drop = $("#drop"), main = $("#main");
main.addEventListener("dragenter", (e) => { if (![...(e.dataTransfer?.types || [])].includes("Files")) return; depth++; drop.hidden = false; main.classList.add("dragging"); });
main.addEventListener("dragover", (e) => { if (![...(e.dataTransfer?.types || [])].includes("Files")) return; e.preventDefault(); $("#composer").classList.toggle("drop-target", !!e.target.closest(".composer")); });
main.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; drop.hidden = true; main.classList.remove("dragging"); $("#composer").classList.remove("drop-target"); } });
main.addEventListener("drop", (e) => { e.preventDefault(); depth = 0; drop.hidden = true; main.classList.remove("dragging"); $("#composer").classList.remove("drop-target"); addFiles(e.dataTransfer.files); });
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]"); const toolsOpen = !!$(".menu.tools"); if (!e.target.closest(".menu")) closeMenus(); if (!a) return;
  const id = a.dataset.id; const t = tray.find((x) => x.id === id) || sentFiles.find((x) => x.id === id);
  const H = {
    drawer: () => { $("#drawer").hidden = false; $("#scrim-d").hidden = false; renderSidebar(); },
    "drawer-close": () => { $("#drawer").hidden = true; $("#scrim-d").hidden = true; },
    samples: () => { $("#drawer").hidden = true; $("#scrim-d").hidden = true; addSamples(); },
    setmodel: () => setModel(+a.dataset.v),
    theme: () => { document.documentElement.dataset.theme = a.dataset.v; store.set("theme", a.dataset.v); renderSidebar(); },
    motion: () => { document.documentElement.dataset.motion = a.dataset.v; store.set("motion", a.dataset.v); renderSidebar(); },
    model: () => { const m = openMenu(a, `<div class="h">MODEL</div>${MODELS.map((x, i) => `<button role="menuitemradio" aria-checked="${x === model}" data-i="${i}">${esc(x.id)}<span class="s">${x.vision ? "Sees images" : "Text only"}</span></button>`).join("")}`); $$("[data-i]", m).forEach((b) => b.addEventListener("click", () => { setModel(+b.dataset.i); closeMenus(); })); },
    switch: () => { const m = openMenu(a, `<div class="h">MODELS THAT SEE IMAGES</div>${MODELS.map((x, i) => x.vision ? `<button data-i="${i}">${esc(x.id)}</button>` : "").join("")}`); $$("[data-i]", m).forEach((b) => b.addEventListener("click", () => { setModel(+b.dataset.i); closeMenus(); toast(`Switched to ${MODELS[+b.dataset.i].id}`); })); },
    remove: () => removeTile(id),
    open: () => { if (!t) return; if (t.k === "photo") openViewer(tray.filter((x) => x.k === "photo").map((x) => x.id), tray.filter((x) => x.k === "photo").indexOf(t)); else if (t.state !== "error") openSheet(t); },
    "m-open": () => openViewer(a.dataset.set.split(","), +a.dataset.i),
    "m-doc": () => t && openSheet(t),
    "rec-menu": () => { const m = openMenu(a, `<button data-x>Cancel transcription</button><button data-x>Clean up transcript</button><button data-x>Download recording</button>`); $$("[data-x]", m).forEach((b) => b.addEventListener("click", () => { closeMenus(); toast("Existing recording actions, now in this menu."); })); },
    "keep-text": () => { if (!lastPaste) return; removeTile(lastPaste.id); input.value += lastPaste.text; autosize(); updateAll(); note(""); lastPaste = null; },
    tools: () => { if (!toolsOpen) openTools(a); },
    "chip-off": () => { const k = a.dataset.k; if (k === "search") setSearch(false); else if (k === "library") setLibrary(false); else if (k === "think") { thinkLvl = "Auto"; renderChips(); } else if (k === "image") setImage(false); $("#tools-btn").focus(); },
    "chip-search": () => openTools($("#tools-btn")),
    "chip-think": () => openTools($("#tools-btn")),
    "chip-image": () => {},
    "chip-library": () => { const m = openMenu(a, `<div class="h">SEARCH FILES IN</div>${["All files", "Market notes", "Receipts"].map((x) => `<button role="menuitemradio" aria-checked="${x === scope}" data-scope="${x}">${x}</button>`).join("")}<div class="sep"></div><button data-off>Turn Library off</button>`); m.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.scope) scope = b.dataset.scope; else library = false; closeMenus(); renderChips(); }); },
    count: () => { const m = openMenu(a, `<div class="h">IMAGES</div>${[1, 2, 3].map((n) => `<button role="menuitemradio" aria-checked="${n === 1}">${n} image${n > 1 ? "s" : ""}</button>`).join("")}`); m.addEventListener("click", () => closeMenus()); },
    "v-close": () => ($("#viewer").hidden = true), "v-prev": () => { vI = (vI - 1 + vSet.length) % vSet.length; showV(); }, "v-next": () => { vI = (vI + 1) % vSet.length; showV(); },
    "sheet-close": closeSheet,
  };
  (H[a.dataset.act] || (() => {}))();

const hoverSet = (e) => { if (e.target.closest?.(".status")) { statusHover = true; return; } const tile = e.target.closest?.(".tile[data-id]"); if (tile && tile.dataset.id !== hoverId && tray.some((x) => x.id === tile.dataset.id && (x.state === "warning" || x.state === "error"))) { hoverId = tile.dataset.id; updateAll(); } };
$("#composer").addEventListener("mouseover", hoverSet); $("#composer").addEventListener("focusin", hoverSet); $("#composer").addEventListener("mouseleave", () => { statusHover = false; if (hoverId) { hoverId = null; updateAll(); } });
$("#v-stage").addEventListener("click", (e) => { if (e.target === $("#v-stage")) $("#viewer").hidden = true; });
$("#scrim-d").addEventListener("click", () => { $("#drawer").hidden = true; $("#scrim-d").hidden = true; });

/* ---------- Boot ---------- */
const th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th;
const mo = store.get("motion", ""); if (mo) document.documentElement.dataset.motion = mo;
renderSidebar();
thread.innerHTML = `<div class="u-row"><div class="bubble">Can you help me pull the spring market plan together?</div></div><div class="a-row"><div class="a-model">${esc(model.id)}</div><div class="answer"><p>Happy to. Attach what you have so far (photos of the stalls, the vendor plan, the recording from yesterday's sync) and I'll turn it into one checklist.</p></div></div>`;
renderChips(); autosize(); updateAll();
})();
