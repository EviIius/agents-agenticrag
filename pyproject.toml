[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticrag"
version = "0.4.0"
description = "Local-first agents and agentic RAG experimentation workbench"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "agents-agenticrag contributors" }]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3,<4"]
documents = ["pypdf>=5"]
docling = ["docling>=2"]

[project.scripts]
agenticrag = "agenticrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenticrag = ["sql/*.sql", "ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
