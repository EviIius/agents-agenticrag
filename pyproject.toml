[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticrag"
version = "0.5.0"
description = "Local chat and web search with immutable source snapshots"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "agents-agenticrag contributors" }]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3,<4"]
documents = ["pypdf>=5"]
docling = ["docling>=2"]
web = ["ddgs>=9.16,<10"]

[project.scripts]
agenticrag = "agenticrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenticrag = ["sql/*.sql", "ui/*.html", "ui/*.css", "ui/*.js", "ui/*.png", "ui/*.webmanifest", "ui/fonts/*.woff2", "ui/fonts/LICENSE-*", "ui/vendor/*.js", "ui/vendor/LICENSE.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
