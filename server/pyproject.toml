[project]
name = "workbench"
version = "1.0.0a0"
description = "Private local-model chat for desktop and phone"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "sse-starlette",
    "pydantic-settings",
    "aiosqlite",
    "python-multipart",
    "trafilatura==2.2.0",
    "pypdf>=6.19.0",
    "ddgs>=9.16.0",
    "sqlite-vec==0.1.9",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["trafilatura", "trafilatura.*", "ddgs", "ddgs.*"]
ignore_missing_imports = true
